<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111418">
<title>音程トレーナー</title>
<style>
:root{--bg:#111418;--card:#1b2026;--fg:#e8eaed;--sub:#9aa3ad;--acc:#4fc3f7;--ok:#66bb6a;--warn:#ffb74d;--bad:#ef5350}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.55;
  padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 14px)}
h1{font-size:21px;margin:6px 0 4px} h1 small{font-size:13px;color:var(--sub);font-weight:400}
h2{font-size:18px;margin:2px 0 8px}
h3{font-size:15px;margin:14px 0 4px}
p{margin:6px 0}
.card{background:var(--card);border-radius:12px;padding:14px;margin:10px 0}
button{font:inherit;color:var(--fg);background:#2a313a;border:0;border-radius:10px;padding:13px 14px;width:100%;margin:6px 0;touch-action:manipulation;cursor:pointer}
button.primary{background:var(--acc);color:#04222e;font-weight:700}
button:disabled{opacity:.4}
.item{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:8px}
.item span{color:var(--sub);font-size:12.5px;text-align:right}
.back{width:auto;background:none;color:var(--acc);padding:6px 0;margin:0}
.big{font-size:52px;font-weight:700;text-align:center;line-height:1.2}
.sub{color:var(--sub);font-size:13px}
.center{text-align:center}
.meter{height:10px;background:#000;border-radius:5px;overflow:hidden}
.meter div{height:100%;background:var(--ok);width:0;transition:width .05s}
canvas{width:100%;height:220px;background:#0b0e11;border-radius:10px;display:block;margin:8px 0}
.pad{height:210px;border-radius:16px;background:#263040;display:flex;align-items:center;justify-content:center;font-size:22px;user-select:none;-webkit-user-select:none;touch-action:none;margin:10px 0}
.pad.flash{background:#3d5a80}
.row{display:flex;gap:8px}.row button{flex:1}
.warn{color:var(--warn)}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:5px 3px;border-bottom:1px solid #2a313a}
select{width:100%;font:inherit;padding:10px;background:#2a313a;color:var(--fg);border:0;border-radius:8px}
input[type=range]{width:100%}
label{display:block;margin:12px 0 4px;font-size:14px}
.cue{font-size:30px;text-align:center;padding:18px 0;font-weight:700}
ul{margin:4px 0;padding-left:20px} li{margin:3px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;margin:2px 4px 2px 0;background:#2a313a}
textarea{width:100%;height:200px;background:#0b0e11;color:var(--fg);border-radius:8px;border:1px solid #2a313a;font-size:12px}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ========== 基本ユーティリティ ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const median=a=>{if(!a.length)return NaN;const b=[...a].sort((x,y)=>x-y);const k=b.length>>1;return b.length%2?b[k]:(b[k-1]+b[k])/2};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:NaN;
const std=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const linreg=(xs,ys)=>{const mx=mean(xs),my=mean(ys);let n=0,d=0;for(let i=0;i<xs.length;i++){n+=(xs[i]-mx)*(ys[i]-my);d+=(xs[i]-mx)**2}return d?n/d:0};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const NOTE_EN=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const NOTE_JA=['ド','ド#','レ','レ#','ミ','ファ','ファ#','ソ','ソ#','ラ','ラ#','シ'];
const m2f=m=>440*Math.pow(2,(m-69)/12);
const f2m=f=>69+12*Math.log2(f/440);
const nn=m=>{const r=Math.round(m);return NOTE_EN[((r%12)+12)%12]+(Math.floor(r/12)-1)};
const nnj=m=>NOTE_JA[((Math.round(m)%12)+12)%12];
const cents=(f,ref)=>1200*Math.log2(f/ref);
const fmtC=c=>(c>0?'+':'')+Math.round(c)+'セント';
const cls=c=>Math.abs(c)<=20?'ok':Math.abs(c)<=50?'warn':'bad';
const dirTxt=c=>Math.abs(c)<=10?'ほぼぴったり':c>0?'高め':'低め';

/* ========== 保存 ========== */
const KEY='pitchTrainer.v1';
let DB=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}})();
DB.settings=Object.assign({low:48,high:64,timbre:'voice',vol:0.8,gate:0.01,latencyMs:null,deviceId:null},DB.settings||{});
DB.results=DB.results||{};
DB.history=DB.history||[];
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}}
function pushHist(key,obj){DB.history.push({key,date:Date.now(),...obj});if(DB.history.length>200)DB.history.splice(0,DB.history.length-200)}

/* ========== オーディオ ========== */
const S={ctx:null,stream:null,src:null,analyser:null,buf:null,running:false,listeners:new Set(),trackLabel:''};
async function ensureAudio(){
  if(!S.ctx){
    try{if(navigator.audioSession)navigator.audioSession.type='play-and-record'}catch(e){}
    S.ctx=new (window.AudioContext||window.webkitAudioContext)();
  }
  if(S.ctx.state!=='running'){try{await S.ctx.resume()}catch(e){}}
}
function micActive(){return !!(S.stream&&S.stream.getAudioTracks().some(t=>t.readyState==='live'))}
async function startMic(deviceId){
  await ensureAudio();
  if(S.stream)S.stream.getTracks().forEach(t=>t.stop());
  const base={echoCancellation:false,noiseSuppression:false,autoGainControl:false};
  let stream;
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:deviceId?{...base,deviceId:{exact:deviceId}}:base});
  }catch(e){
    if(!deviceId)throw e;
    stream=await navigator.mediaDevices.getUserMedia({audio:base});
  }
  S.stream=stream;
  if(S.src)try{S.src.disconnect()}catch(e){}
  S.src=S.ctx.createMediaStreamSource(stream);
  S.analyser=S.ctx.createAnalyser();
  S.analyser.fftSize=2048;
  S.src.connect(S.analyser);
  S.buf=new Float32Array(S.analyser.fftSize);
  S.trackLabel=stream.getAudioTracks()[0]?.label||'';
  if(!S.running){S.running=true;loop()}
}
// YIN法による基本周波数推定
function yin(x,sr){
  const W=1024,tauMin=Math.max(2,Math.floor(sr/1100)),tauMax=Math.min(x.length-W-1,Math.floor(sr/65));
  const d=new Float32Array(tauMax+2);
  for(let tau=1;tau<=tauMax+1;tau++){let s=0;for(let j=0;j<W;j++){const v=x[j]-x[j+tau];s+=v*v}d[tau]=s}
  let run=0;d[0]=1;
  for(let tau=1;tau<=tauMax+1;tau++){run+=d[tau];d[tau]=run>0?d[tau]*tau/run:1}
  const th=0.15;let tau=-1;
  for(let t=tauMin;t<=tauMax;t++){if(d[t]<th){while(t+1<=tauMax&&d[t+1]<d[t])t++;tau=t;break}}
  if(tau<0)return null;
  let b=tau;const a=d[tau-1],c=d[tau+1],den=a+c-2*d[tau];
  if(den!==0)b=tau+(a-c)/(2*den);
  return {f:sr/b,conf:1-d[tau]};
}
function loop(){
  if(!S.analyser){S.running=false;return}
  S.analyser.getFloatTimeDomainData(S.buf);
  let r=0;for(let i=0;i<S.buf.length;i++)r+=S.buf[i]*S.buf[i];
  r=Math.sqrt(r/S.buf.length);
  let p=null;
  if(r>DB.settings.gate){const y=yin(S.buf,S.ctx.sampleRate);if(y&&y.f>60&&y.f<1100)p=y}
  const fr={t:S.ctx.currentTime,f:p?p.f:null,rms:r};
  S.listeners.forEach(fn=>{try{fn(fr)}catch(e){console.error(e)}});
  setTimeout(loop,25);
}
// 録音（指定時間ぶんのフレームを集める）
function collect(ms,onFrame){
  return new Promise(res=>{
    const arr=[],t0=S.ctx.currentTime;
    const fn=p=>{
      arr.push({t:p.t-t0,f:p.f,rms:p.rms});
      if(onFrame)onFrame(p);
      if(p.t-t0>=ms/1000){S.listeners.delete(fn);res(arr)}
    };
    S.listeners.add(fn);
  });
}
// 音声まわりを作り直す（iOSで音が出なくなった時用）
async function resetAudio(){
  if(S.stream)S.stream.getTracks().forEach(t=>t.stop());
  S.stream=null;S.analyser=null;
  try{if(S.ctx)await S.ctx.close()}catch(e){}
  S.ctx=null;for(const k in waveCache)delete waveCache[k];
  await sleep(100);
  await startMic(DB.settings.deviceId);
}
async function sleepUntil(t){while(S.ctx.currentTime<t)await sleep(15)}

/* ========== 基準音 ========== */
const WAVES={voice:[1,.65,.5,.35,.25,.15,.1,.06,.04],piano:[1,.5,.3,.22,.12,.08,.05],sine:[1]};
const waveCache={};
function getWave(){
  const k=DB.settings.timbre;
  if(!waveCache[k]){
    const h=WAVES[k]||WAVES.voice,re=new Float32Array(h.length+1),im=new Float32Array(h.length+1);
    h.forEach((a,i)=>im[i+1]=a);
    waveCache[k]=S.ctx.createPeriodicWave(re,im);
  }
  return waveCache[k];
}
function playTone(freq,dur,when){
  const ctx=S.ctx,t0=when??ctx.currentTime+0.05,G=0.22*DB.settings.vol;
  const o=ctx.createOscillator(),g=ctx.createGain();
  o.setPeriodicWave(getWave());o.frequency.value=freq;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(G,t0+0.03);
  if(DB.settings.timbre==='piano')g.gain.exponentialRampToValueAtTime(G*0.25,t0+dur);
  else g.gain.setValueAtTime(G,t0+dur);
  g.gain.linearRampToValueAtTime(0,t0+dur+0.08);
  o.connect(g).connect(ctx.destination);
  o.start(t0);o.stop(t0+dur+0.12);
  return t0;
}
function click(t,accent){
  const ctx=S.ctx,o=ctx.createOscillator(),g=ctx.createGain();
  o.frequency.value=accent?1600:1000;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.5*DB.settings.vol,t+0.002);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.05);
  o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+0.06);
}

/* ========== 音程グラフ ========== */
function makePlot(canvas,opts){
  const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;
  const g=canvas.getContext('2d');g.scale(dpr,dpr);
  const pts=[],win=opts.win||4,target=opts.mode==='target';
  let center=target?opts.target:null;
  function draw(now){
    g.clearRect(0,0,w,h);
    const vis=pts.filter(p=>p.t>now-win);
    if(!target){
      const ms=vis.filter(p=>p.m!=null).slice(-12).map(p=>p.m);
      if(ms.length){const c=median(ms);if(center==null||Math.abs(c-center)>2)center=Math.round(c)}
    }
    if(center==null)center=55;
    const span=target?1.5:3.5,y=m=>h/2-(m-center)/span*(h/2);
    if(target){g.fillStyle='rgba(102,187,106,.16)';g.fillRect(0,y(center+0.2),w,y(center-0.2)-y(center+0.2))}
    g.font='11px sans-serif';g.lineWidth=1;
    for(let k=Math.ceil(center-span);k<=Math.floor(center+span);k++){
      const isT=target&&k===center;
      g.strokeStyle=isT?'#66bb6a':'#2c333b';g.lineWidth=isT?2:1;
      g.beginPath();g.moveTo(0,y(k));g.lineTo(w,y(k));g.stroke();
      g.fillStyle=isT?'#66bb6a':'#7b8590';g.fillText(nn(k)+' '+nnj(k),4,y(k)-3);
    }
    g.strokeStyle='#4fc3f7';g.lineWidth=2.5;g.lineJoin='round';g.beginPath();
    let pen=false;
    for(const p of vis){
      const x=w-(now-p.t)/win*w;
      if(p.m==null||Math.abs(p.m-center)>span+1){pen=false;continue}
      const yy=y(p.m);
      if(!pen){g.moveTo(x,yy);pen=true}else g.lineTo(x,yy);
    }
    g.stroke();
  }
  return {add:(t,m)=>pts.push({t,m}),draw,pts};
}

/* ========== 画面遷移 ========== */
const app=$('#app');let viewId=0;const VIEWS={};
function go(name){viewId++;S.listeners.clear();(VIEWS[name]||VIEWS.home)();window.scrollTo(0,0)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.stream&&!micActive()){S.stream=null;go('home')}});
const hdr=t=>`<button class="back" data-go="home">‹ ホーム</button><h2>${t}</h2>`;
const BT_RE=/airpods|bluetooth|hands.?free|headset|buds|beats|ヘッドセット|イヤホン/i;
const btWarn=l=>BT_RE.test(l||'')?'<p class="warn">⚠ Bluetoothイヤホンのマイクが使われているようです。通話モードに切り替わって音質が落ち、音程の検出が不安定になることがあります。下の「入力デバイス」で「iPhoneマイク」に切り替えられるか試してください。</p>':'';
function withMic(render){
  if(micActive()){render();return}
  const tok=viewId;
  app.innerHTML=hdr('マイクの準備')+`<div class="card"><p>この練習ではマイクを使います。</p><button class="primary" id="m">マイクを開始</button><p class="sub warn" id="e"></p></div>`;
  $('#m').onclick=async()=>{
    try{await startMic(DB.settings.deviceId);if(tok===viewId)render()}
    catch(e){$('#e').textContent='マイクを開始できませんでした（'+e.name+'）。HTTPSのページで開いているか、iPhoneの設定 > Safari > マイク の許可を確認してください。'}
  };
}

/* ========== ホーム ========== */
VIEWS.home=()=>{
  const R=DB.results,st=DB.settings;
  const item=(go,t,s)=>`<button class="item" data-go="${go}"><b>${t}</b><span>${s}</span></button>`;
  const no='未実施';
  app.innerHTML=`<h1>音程トレーナー</h1>
  <p class="sub">イヤホンで基準音を聞き、マイクで声を測ります。最初は診断の0〜④を順にどうぞ。</p>
  <div class="card">${micActive()?`🎤 <b>${esc(S.trackLabel||'マイク')}</b>`:'<span class="sub">マイク未接続</span>'}
    <button class="primary" data-go="mic">${micActive()?'マイクチェック':'マイクを開始・チェック'}</button></div>
  <h3>診断</h3><div class="card">
    ${item('calib','0. 遅延キャリブレーション',R.calib?`遅延 ${R.calib.latency}ms／ばらつき ${R.calib.sd}ms`:no)}
    ${item('disc','① 聴き分け（耳）',R.disc?`約${R.disc.thr}セント`:no)}
    ${item('longtone','② ロングトーン（安定性）',R.longtone?`揺れ ${Math.round(R.longtone.sd)}セント`:no)}
    ${item('match','③ 聞いてから歌う',R.match?`平均ずれ ${Math.round(R.match.mae)}セント`:no)}
    ${item('matchVis','④ 画面を見ながら歌う',R.matchVis?`平均ずれ ${Math.round(R.matchVis.mae)}セント`:no)}
    <button class="primary" data-go="results">診断結果とアドバイス</button>
  </div>
  <h3>音程の練習</h3><div class="card">
    ${item('onset','🎯 出だし練習（しゃくり対策）',R.onset?`まっすぐ ${R.onset.straight}/${R.onset.n}`:no)}
    ${item('phrase','🎼 フレーズ練習（音の移動）',R.phrase?`Lv${(st.phrase?.level??0)+1}・まっすぐ ${R.phrase.straight}/${R.phrase.n}`:no)}
    ${item('interval','🎹 音階・音程練習',R.interval?`まっすぐ ${R.interval.straight}/${R.interval.n}`:no)}
    ${item('unison','👥 一緒に歌う（ユニゾン）',R.unison?`平均ずれ ${Math.round(R.unison.mae)}セント`:no)}
  </div>
  <h3>高音・リズム</h3><div class="card">
    ${item('range','📏 音域チェック',R.range?`${nn(R.range.lo)}〜${nn(R.range.hi)}`:no)}
    ${item('siren','🚨 サイレン練習（換声点）',R.siren?(R.siren.breaks.length?`切り替わり ${R.siren.breaks.map(nn).join('・')}`:'なめらか'):no)}
    ${item('rhythm','🥁 リズム練習',R.rhythm?`ばらつき ${R.rhythm.sd}ms`:no)}
  </div>
  <h3>記録</h3><div class="card">
    ${item('free','🎵 フリー歌唱（録音・聞き返し）',R.free?`前回 ${R.free.notes}音`:'音楽を聞きながら歌う')}
    ${item('history','📈 上達の履歴',`${DB.history.length}件`)}
    ${item('settings','⚙ 設定',`音域 ${nn(st.low)}〜${nn(st.high)}`)}
  </div>`;
};

/* ========== マイクチェック ========== */
VIEWS.mic=()=>withMic(async()=>{
  const tok=viewId;
  app.innerHTML=hdr('マイクチェック')+`<div class="card">
    <div class="sub">使用中の入力</div><div><b id="lbl">${esc(S.trackLabel||'(名称不明)')}</b></div><div id="warn">${btWarn(S.trackLabel)}</div>
    <label>入力デバイス</label><select id="dev"><option value="">（既定）</option></select>
    <label>入力レベル</label><div class="meter"><div id="lvl"></div></div>
    <div class="big" id="note">--</div><div class="center" id="hz" style="font-size:20px">--- Hz</div><div class="sub center" id="cn">「あー」と声を出すと音名が表示されます</div>
    <label>波形（マイク入力）</label><canvas id="wave" style="height:110px"></canvas>
    <button id="beep">テスト音を鳴らす（${nn(57)}）</button>
    <button id="reset">音声をリセット（音が出ない時）</button>
    <p class="sub" id="diag"></p></div>
  <div class="card sub">
    <b>うまくいかないとき</b>
    <ul>
      <li>理想は「音はBTイヤホン、マイクはiPhone本体」です。上の表示がイヤホン名になっていたら、入力デバイスの切り替えを試してください。</li>
      <li>声を出してもレベルが動かない・音名が出ないときは、設定の「声の検出しきい値」を下げてください。</li>
      <li>静かな場所で、iPhoneを口から30cmくらい離して使うと安定します。</li>
    </ul></div>`;
  const sel=$('#dev');
  async function fillDevs(){
    try{
      const ds=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audioinput');
      sel.innerHTML='<option value="">（既定）</option>'+ds.map(d=>`<option value="${esc(d.deviceId)}">${esc(d.label||'入力 '+d.deviceId.slice(0,6))}</option>`).join('');
      sel.value=DB.settings.deviceId||'';
    }catch(e){}
  }
  await fillDevs();if(tok!==viewId)return;
  sel.onchange=async()=>{
    DB.settings.deviceId=sel.value||null;save();
    try{await startMic(DB.settings.deviceId)}catch(e){}
    $('#lbl').textContent=S.trackLabel||'(名称不明)';$('#warn').innerHTML=btWarn(S.trackLabel);
    go('mic');
  };
  const diag=()=>{const c=S.ctx;$('#diag').textContent=`状態: ${c.state} ／ ${c.sampleRate}Hz${c.outputLatency?` ／ 出力遅延(参考) ${Math.round(c.outputLatency*1000)}ms`:''} ／ audioSession: ${navigator.audioSession?navigator.audioSession.type:'非対応'}`};
  diag();
  $('#beep').onclick=async()=>{await ensureAudio();playTone(m2f(57),1.0);diag()};
  $('#reset').onclick=async()=>{
    $('#reset').disabled=true;$('#reset').textContent='リセット中…';
    try{await resetAudio()}catch(e){$('#diag').textContent='リセット失敗: '+e.name;return}
    if(tok!==viewId)return;
    go('mic');
  };
  const wc=$('#wave'),dpr=window.devicePixelRatio||1,ww=wc.clientWidth,wh=wc.clientHeight;
  wc.width=ww*dpr;wc.height=wh*dpr;const wg=wc.getContext('2d');wg.scale(dpr,dpr);
  const recent=[];let fcount=0;
  S.listeners.add(p=>{
    const db=20*Math.log10(p.rms+1e-9);
    $('#lvl').style.width=clamp((db+60)/60*100,0,100)+'%';
    if(p.f){recent.push(f2m(p.f));if(recent.length>4)recent.shift()}else recent.length=0;
    if(recent.length>=2){const m=median(recent),c=(m-Math.round(m))*100;$('#note').textContent=nn(m)+' '+nnj(m);$('#hz').textContent=p.f.toFixed(1)+' Hz';$('#cn').innerHTML=`<span class="${cls(c)}">${nn(m)}から ${fmtC(c)}</span>`}
    else $('#hz').textContent='--- Hz';
    // 波形（約20ms分）
    if(++fcount%2)return;
    const b=S.buf,n=Math.min(b.length,Math.round(S.ctx.sampleRate*0.02));
    let mx=0.02;for(let i=0;i<n;i++)mx=Math.max(mx,Math.abs(b[i]));
    wg.clearRect(0,0,ww,wh);wg.strokeStyle='#2c333b';wg.beginPath();wg.moveTo(0,wh/2);wg.lineTo(ww,wh/2);wg.stroke();
    wg.strokeStyle=p.f?'#4fc3f7':'#5f6b77';wg.lineWidth=1.5;wg.beginPath();
    for(let i=0;i<n;i++){const x=i/n*ww,y=wh/2-b[i]/mx*(wh/2-4);i?wg.lineTo(x,y):wg.moveTo(x,y)}
    wg.stroke();
  });
});

/* ========== 0. 遅延キャリブレーション ========== */
VIEWS.calib=()=>{
  const tok=viewId,BPM=90,iv=60/BPM,COUNT=4,BEATS=16;
  app.innerHTML=hdr('0. 遅延キャリブレーション')+`
  <p class="sub">Bluetoothイヤホンの音の遅れを測ります。「カッ」という音に合わせて下の枠をタップしてください。最初の4拍（高い音）は準備で、その後の16拍を計測します。リズムの安定度もわかります。</p>
  <div class="pad" id="pad">ここをタップ</div>
  <div id="st" class="center sub"></div>
  <button class="primary" id="start">スタート</button>
  <div id="res"></div>`;
  const pad=$('#pad'),stEl=$('#st');
  let taps=null;
  pad.addEventListener('pointerdown',e=>{
    e.preventDefault();if(!taps)return;
    taps.push(S.ctx.currentTime);pad.classList.add('flash');setTimeout(()=>pad.classList.remove('flash'),80);
  });
  $('#start').onclick=async()=>{
    await ensureAudio();if(tok!==viewId)return;
    $('#start').disabled=true;$('#res').innerHTML='';
    const t0=S.ctx.currentTime+0.6,beats=[];
    for(let i=0;i<COUNT+BEATS;i++){const t=t0+i*iv;click(t,i<COUNT);if(i>=COUNT)beats.push(t)}
    taps=[];
    const end=t0+(COUNT+BEATS)*iv+0.4;
    while(S.ctx.currentTime<end){
      if(tok!==viewId)return;
      const k=Math.floor((S.ctx.currentTime-t0)/iv);
      stEl.textContent=k<0?'準備…':k<COUNT?`準備 ${k+1}/${COUNT}`:`計測中 ${Math.min(k-COUNT+1,BEATS)}/${BEATS}`;
      await sleep(50);
    }
    const offs=[];
    for(const t of taps){
      let best=null;for(const b of beats){if(best==null||Math.abs(t-b)<Math.abs(t-best))best=b}
      const o=t-best;if(Math.abs(o)<iv/2)offs.push(o*1000);
    }
    taps=null;$('#start').disabled=false;$('#start').textContent='もう一度';stEl.textContent='';
    if(offs.length<10){$('#res').innerHTML='<p class="warn">タップが少なすぎました（10回以上必要）。もう一度どうぞ。</p>';return}
    const lat=Math.round(median(offs)),sd=Math.round(std(offs));
    DB.results.calib={latency:lat,sd,n:offs.length,date:Date.now()};
    DB.settings.latencyMs=Math.max(0,lat);pushHist('calib',{latency:lat,sd});save();
    const rh=sd<=20?'<span class="ok">とても安定</span>':sd<=35?'<span class="ok">安定</span>':'<span class="warn">ばらつきが大きめ</span>';
    $('#res').innerHTML=`<div class="card"><p>音の遅れ（タップのクセ込み）: <b>${lat}ms</b></p><p>タップのばらつき: <b>${sd}ms</b>（${rh}）</p>
      <p class="sub">遅れの値は、③④で「基準音が耳に届き終わってから歌い始める」タイミングの補正に使います。BTイヤホンでは100〜300ms程度が一般的です。ばらつきはリズム感の目安です（今後のリズム練習の土台）。</p></div>`;
  };
};

/* ========== ① 聴き分け ========== */
VIEWS.disc=()=>{
  const tok=viewId,alive=()=>tok===viewId;
  let d=150,streak=0,lastDir=null,rev=[],n=0,pair=null,busy=false,done=false,practice=false;
  app.innerHTML=hdr('① 聴き分けテスト')+`
  <p class="sub">2つの音が順番に鳴ります。<b>高かった方</b>を選んでください。正解が続くと差が小さくなり、間違えると大きくなります（3〜5分）。わからないときは勘で答えてOKです。マイクは使いません。</p>
  <div class="card"><label style="margin-top:0"><input type="checkbox" id="prac"> 練習モード（聞き直しOK・結果は記録しない）</label>
  <p class="sub">診断モードでは、各問題の音は1回しか聞けません。</p>
  <div id="prog" class="sub">0問</div><div id="cue" class="cue">—</div>
  <button class="primary" id="play">▶ 音を聞く</button>
  <div class="row"><button id="a1" disabled>1つ目が高い</button><button id="a2" disabled>2つ目が高い</button></div>
  <p id="fb" class="center"></p></div>`;
  const cue=$('#cue'),a1=$('#a1'),a2=$('#a2'),fb=$('#fb'),playB=$('#play');
  async function play(){
    if(busy||done)return;
    if(pair&&!practice)return;
    busy=true;$('#prac').disabled=true;await ensureAudio();
    if(!pair){
      const base=m2f(48+Math.random()*12),hi=Math.random()<0.5?1:2;
      const lo=base*Math.pow(2,-d/2400),up=base*Math.pow(2,d/2400);
      pair={hi,f1:hi===1?up:lo,f2:hi===1?lo:up};
    }
    a1.disabled=a2.disabled=true;
    const t=S.ctx.currentTime+0.1;
    playTone(pair.f1,0.5,t);playTone(pair.f2,0.5,t+0.8);
    cue.textContent='1つ目…';await sleepUntil(t+0.75);if(!alive())return;
    cue.textContent='2つ目…';await sleepUntil(t+1.35);if(!alive())return;
    cue.textContent='どっちが高い？';a1.disabled=a2.disabled=false;busy=false;
    if(practice)playB.textContent='↻ もう一度聞く';else playB.disabled=true;
  }
  function answer(k){
    if(!pair||busy)return;
    const ok=k===pair.hi;n++;
    fb.innerHTML=ok?`<span class="ok">正解</span> <span class="sub">（差 約${Math.round(d)}セント）</span>`:`<span class="bad">不正解</span> <span class="sub">（差 約${Math.round(d)}セント）</span>`;
    let dir=null;
    if(ok){streak++;if(streak>=2){streak=0;dir='down'}}else{streak=0;dir='up'}
    if(dir){if(lastDir&&dir!==lastDir)rev.push(d);lastDir=dir;d=dir==='down'?Math.max(2,d/1.4):Math.min(800,d*1.4)}
    pair=null;a1.disabled=a2.disabled=true;playB.textContent='▶ 音を聞く';playB.disabled=false;
    $('#prog').textContent=`${n}問`;
    if(rev.length>=8||n>=50){finish();return}
    setTimeout(()=>{if(alive())play()},700);
  }
  function finish(){
    done=true;
    const r=rev.slice(-6),thr=Math.round(r.length>=2?Math.exp(mean(r.map(Math.log))):d);
    if(!practice){DB.results.disc={thr,n,date:Date.now()};pushHist('disc',{thr});save()}
    cue.textContent='完了';
    fb.innerHTML=`聴き分けられる差: <b>約${thr}セント</b>${practice?'（練習モードのため記録なし）':''}<br><span class="sub">（100セント＝半音。一般的には10〜30セント前後で判別できる人が多いです）</span>`;
    playB.textContent='ホームへ';playB.disabled=false;playB.onclick=()=>go('home');
  }
  $('#prac').onchange=e=>{practice=e.target.checked};
  playB.onclick=play;a1.onclick=()=>answer(1);a2.onclick=()=>answer(2);
};

/* ========== オクターブ誤検出の補正 ========== */
// 声の出始めなどで1オクターブずれて検出されたフレームを、全体の中央値と同じオクターブに寄せる
function foldOct(v){
  if(!v.length)return v;
  const ref=median(v.map(a=>a.f));
  return v.map(a=>({...a,f:a.f*Math.pow(2,-Math.round(cents(a.f,ref)/1200))}));
}

/* ========== ② ロングトーン ========== */
function analyzeLong(arr){
  const v=foldOct(arr.filter(a=>a.f));if(v.length<20)return null;
  const tOn=v[0].t,s=v.filter(a=>a.t>=tOn+0.7);if(s.length<15)return null;
  const fm=median(s.map(a=>a.f)),c=s.map(a=>cents(a.f,fm));
  const keep=c.map((x,i)=>[x,s[i].t]).filter(([x])=>Math.abs(x)<300);
  const cs=keep.map(k=>k[0]),ts=keep.map(k=>k[1]),m=f2m(fm);
  return {m,dev:(m-Math.round(m))*100,sd:std(cs),drift:linreg(ts,cs),dur:s[s.length-1].t-tOn};
}

/* ========== ③④ 聞いて歌う ========== */
function analyzeMatch(arr,target){
  const v=foldOct(arr.filter(a=>a.f));if(v.length<10)return null;
  const tOn=v[0].t;
  const onset=v.filter(a=>a.t<tOn+0.15).map(a=>a.f);
  const stable=v.filter(a=>a.t>=tOn+0.4).map(a=>a.f);
  if(stable.length<6)return null;
  const fS=median(stable),fO=median(onset);
  const raw=cents(fS,target),oct=Math.round(raw/1200),err=raw-1200*oct;
  const onErr=cents(fO,target)-1200*oct;
  return {f:fS,raw,oct,err,onErr,sd:std(stable.map(f=>cents(f,fS)))};
}
function summarizeMatch(T,st){
  const errs=T.map(t=>t.err),center=(st.low+st.high)/2;
  return {n:T.length,mae:mean(errs.map(Math.abs)),bias:mean(errs),scoop:median(T.map(t=>t.onErr-t.err)),
    octs:T.filter(t=>t.oct).length,slope:T.length>=5?linreg(T.map(t=>t.m-center),errs):0,
    trials:T.map(t=>({m:t.m,err:Math.round(t.err),on:Math.round(t.onErr)}))};
}
function matchView(visual){

    同じ高さが出しにくければ1オクターブ下でもOKです（別に記録されます）。音域 ${nn(st.low)}〜${nn(st.high)}（設定で変更可）。全${N}音。</p>
    <div class="card"><div id="prog" class="sub">0 / ${N}</div><div id="cue" class="cue">準備OK</div>

/* ========== 出だし練習 ========== */
function analyzeOnset(arr,target){
  const v=foldOct(arr.filter(a=>a.f));if(v.length<5)return null;
  // 声の出始め＝有声フレームが2つ以上続いた最初の位置
  let i0=-1;
  for(let i=0;i+1<v.length;i++){if(v[i+1].t-v[i].t<0.08){i0=i;break}}
  if(i0<0)return null;
  const tOn=v[i0].t,seg=v.slice(i0).filter(a=>a.t<=tOn+1.2);
  const fin=seg.filter(a=>a.t>=tOn+0.15).map(a=>a.f);
  if(fin.length<3)return null;
  const fF=median(fin),oct=Math.round(cents(fF,target)/1200),tgt=target*Math.pow(2,oct);
  const c=seg.map(a=>({t:a.t-tOn,c:cents(a.f,tgt)}));
  const on=median(c.filter(x=>x.t<=0.08).map(x=>x.c));
  let settle=null;
  for(let i=0;i+2<c.length;i++){if([0,1,2].every(k=>Math.abs(c[i+k].c)<=30)){settle=Math.round(c[i].t*1000);break}}
  return {on,fin:cents(fF,tgt),settle,oct,trace:c};
}
function drawOnset(canvas,trace){
  const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;const g=canvas.getContext('2d');g.scale(dpr,dpr);
  const R=300,T=1.0,x=t=>(t+0.05)/(T+0.05)*w,y=c=>h/2-clamp(c,-R,R)/R*(h/2-6);
  g.fillStyle='rgba(102,187,106,.16)';g.fillRect(0,y(30),w,y(-30)-y(30));
  g.font='11px sans-serif';
  for(const [c,l] of [[0,'目標'],[100,'+半音'],[-100,'-半音'],[200,'+全音'],[-200,'-全音']]){
    g.strokeStyle=c?'#2c333b':'#66bb6a';g.lineWidth=c?1:2;g.beginPath();g.moveTo(0,y(c));g.lineTo(w,y(c));g.stroke();
    g.fillStyle=c?'#7b8590':'#66bb6a';g.fillText(l,4,y(c)-3);
  }
  for(const t of [0,0.25,0.5,0.75]){g.strokeStyle='#2c333b';g.beginPath();g.moveTo(x(t),0);g.lineTo(x(t),h);g.stroke();g.fillStyle='#7b8590';g.fillText(t+'秒',x(t)+3,h-4)}
  g.strokeStyle='#4fc3f7';g.lineWidth=2.5;g.lineJoin='round';g.beginPath();
  trace.filter(p=>p.t<=T).forEach((p,i)=>{i?g.lineTo(x(p.t),y(p.c)):g.moveTo(x(p.t),y(p.c))});
  g.stroke();
}

/* ========== フレーズ練習 ========== */
function makePhrase(n,maxLeap,low,high){
  for(let tries=0;tries<200;tries++){
    const ph=[low+Math.floor(Math.random()*(high-low+1))];
    let ok=true;
    for(let i=1;i<n;i++){
      const opts=[];for(let d=-maxLeap;d<=maxLeap;d++)if(d!==0)opts.push(d);
      const nx=ph[i-1]+opts[Math.floor(Math.random()*opts.length)];
      if(nx<low||nx>high){ok=false;break}ph.push(nx);
    }
    if(ok)return ph;
  }
  return Array.from({length:n},(_,i)=>low+i);
}
// 声を音ごとの塊に分ける（無声で途切れる or 音の高さが急に変わる所で区切る）
function segPhrase(arr){
  const segs=[];let cur=[],gap=0;
  for(const a of arr){
    if(!a.f){gap++;if(gap>=2&&cur.length){segs.push(cur);cur=[]}continue}
    gap=0;let m=f2m(a.f);
    if(cur.length>=3){
      const md=median(cur.slice(-4).map(x=>x.m));let d=m-md;
      const o=Math.round(d/12);if(o){m-=12*o;d-=12*o}
      if(Math.abs(d)>0.7){segs.push(cur);cur=[]}
    }
    cur.push({t:a.t,m});
  }
  if(cur.length)segs.push(cur);
  return segs.filter(s=>s.length>=3).map(s=>{
    const ref=median(s.map(x=>x.m)),fr=s.map(x=>({t:x.t,m:x.m-12*Math.round((x.m-ref)/12)}));
    const t0=fr[0].t,dur=fr[fr.length-1].t-t0;
    const on=median(fr.filter(x=>x.t<=t0+0.06).map(x=>x.m));
    const tail=fr.filter(x=>x.t>=t0+Math.min(0.1,dur/2));
    return {t0,dur,on,fin:median(tail.map(x=>x.m)),frames:fr};
  });
}
function analyzePhrase(arr,notes,exp,beat){
  const segs=segPhrase(arr),res=[];let si=0;
  for(let k=0;k<notes.length;k++){
    let best=-1,bd=1e9;
    for(let j=si;j<segs.length;j++){
      const d=segs[j].t0-exp[k];
      if(d<-0.5*beat)continue;if(d>0.9*beat)break;
      if(Math.abs(d)<bd){bd=Math.abs(d);best=j}
    }
    if(best<0){res.push(null);continue}
    res.push(segs[best]);si=best+1;
  }
  const found=res.map((r,k)=>r&&{r,k}).filter(Boolean);
  if(!found.length)return null;
  const oct=Math.round(median(found.map(({r,k})=>r.fin-notes[k]))/12);
  return res.map((r,k)=>{
    if(!r)return null;
    const tg=notes[k]+12*oct,fr=r.frames.map(x=>({t:x.t,c:(x.m-tg)*100}));
    let settle=null;
    for(let i=0;i+1<fr.length;i++){if(Math.abs(fr[i].c)<=30&&Math.abs(fr[i+1].c)<=30){settle=Math.round((fr[i].t-r.t0)*1000);break}}
    return {on:(r.on-tg)*100,fin:(r.fin-tg)*100,timing:Math.round((r.t0-exp[k])*1000),settle,t0:r.t0,trace:fr,oct};
  });
}
function drawPhrase(canvas,notes,exp,beat,res,tEnd){
  const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;const g=canvas.getContext('2d');g.scale(dpr,dpr);
  const oct=(res||[]).find(r=>r)?.oct||0,ns=notes.map(n=>n+12*oct);
  const lo=Math.min(...ns)-2,hi=Math.max(...ns)+2,t0=exp[0]-0.3,t1=tEnd;
  const x=t=>(t-t0)/(t1-t0)*w,y=m=>h-6-(m-lo)/(hi-lo)*(h-12);
  g.font='11px sans-serif';
  for(let k=Math.ceil(lo);k<=Math.floor(hi);k++){g.strokeStyle='#22282f';g.beginPath();g.moveTo(0,y(k));g.lineTo(w,y(k));g.stroke()}
  ns.forEach((m,k)=>{
    g.fillStyle='rgba(102,187,106,.25)';g.fillRect(x(exp[k]),y(m+0.3),x(exp[k]+beat*0.85)-x(exp[k]),y(m-0.3)-y(m+0.3));
    g.fillStyle='#66bb6a';g.fillText(nn(m)+' '+nnj(m),x(exp[k])+2,y(m+0.3)-3);
  });
  if(res){
    g.strokeStyle='#4fc3f7';g.lineWidth=2.5;g.lineJoin='round';
    res.forEach((r,k)=>{if(!r)return;g.beginPath();r.trace.forEach((p,i)=>{const yy=y(ns[k]+p.c/100);i?g.lineTo(x(p.t),yy):g.moveTo(x(p.t),yy)});g.stroke()});
  }
}
// 録音（聞き返し用）
function recStart(){
  if(!window.MediaRecorder||!S.stream)return null;
  try{
    const mr=new MediaRecorder(S.stream),ch=[];
    mr.ondataavailable=e=>{if(e.data&&e.data.size)ch.push(e.data)};
    mr.start();
    return {stop:()=>new Promise(res=>{
      mr.onstop=()=>res(ch.length?URL.createObjectURL(new Blob(ch,{type:mr.mimeType||ch[0].type})):null);
      try{mr.stop()}catch(e){res(null)}
    })};
  }catch(e){return null}
}
const audioTag=url=>url?`<p class="sub" style="margin-bottom:0">今の歌を聞き返す:</p><audio controls src="${url}" style="width:100%"></audio>`:'';
// フレーズを1回「聞く→思い浮かべる→歌う」。戻り値: null=画面を離れた / {r,url}
async function performPhrase(notes,beat,ui){
  const st=DB.settings,lat=Math.max(0,st.latencyMs??200)/1000,{cue,boxes,cv,alive}=ui;
  boxes.innerHTML=notes.map(()=>`<div style="flex:1;height:34px;border-radius:8px;background:#2a313a"></div>`).join('');
  const bx=[...boxes.children],lit=k=>bx.forEach((b,j)=>b.style.background=j===k?'#4fc3f7':'#2a313a');
  cue.textContent='♪ 聞いて…';
  const tp=S.ctx.currentTime+0.1;
  notes.forEach((m,k)=>playTone(m2f(m),beat*0.85,tp+k*beat));
  for(let k=0;k<notes.length;k++){await sleepUntil(tp+k*beat);if(!alive())return null;lit(k)}
  await sleepUntil(tp+notes.length*beat+lat+0.2);if(!alive())return null;lit(-1);
  cue.textContent='💭 頭の中で鳴らして…';
  await sleep(clamp(notes.length*beat*1000,1000,2500));if(!alive())return null;
  const tc=S.ctx.currentTime,exp=notes.map((_,k)=>(2+k)*beat);
  const rc=recStart(),rec=collect(((2+notes.length)*beat+0.7)*1000);
  for(let k=-2;k<notes.length;k++){
    await sleepUntil(tc+(k+2)*beat);
    if(!alive()){if(rc)rc.stop();return null}
    if(k<0){cue.textContent=k===-2?'2':'1'}else{cue.textContent='🎤 ア';lit(k)}
  }
  const arr=await rec,url=rc?await rc.stop():null;
  if(!alive())return null;
  lit(-1);cue.textContent='—';
  const r=analyzePhrase(arr,notes,exp,beat);
  drawPhrase(cv,notes,exp,beat,r,(2+notes.length)*beat+0.4);
  return {r,url};
}
function phraseRows(r,notes){
  return r.map((x,k)=>{
    const mv=k?`<span class="sub">（${notes[k]>notes[k-1]?'↑':notes[k]<notes[k-1]?'↓':'→'}${Math.abs(notes[k]-notes[k-1])}）</span>`:'';
    if(!x)return `<tr><td>${nn(notes[k])}${mv}</td><td colspan="3" class="bad">検出なし</td></tr>`;
    return `<tr><td>${nn(notes[k])}${mv}</td><td class="${Math.abs(x.on)<=30?'ok':'warn'}">出だし ${fmtC(x.on)}</td><td class="${cls(x.fin)}">着地 ${fmtC(x.fin)}</td><td class="sub">${x.timing>0?'+':''}${x.timing}ms</td></tr>`;
  }).join('');
}
const LV=[[2,60,2],[2,80,2],[3,60,2],[3,80,2],[3,80,4],[4,80,4],[4,100,4],[4,100,7],[4,120,7]];

/* ========== フリー歌唱 ========== */
function segment(fr){
  const segs=[];let cur=[],gap=0;
  const close=()=>{
    if(cur.length>=2){
      const dur=cur[cur.length-1].t-cur[0].t;
      if(dur>=0.35){
        const s=cur.filter(x=>x.t>=cur[0].t+0.1).map(x=>x.m);
        if(s.length>=5){const md=median(s);segs.push({m:md,dev:(md-Math.round(md))*100,sd:std(s.map(x=>(x-md)*100)),dur})}
      }
    }
    cur=[];gap=0;
  };
  for(const f of fr){
    if(f.m==null){gap++;if(gap>3)close();continue}
    gap=0;
    if(cur.length){const md=median(cur.slice(-8).map(x=>x.m));if(Math.abs(f.m-md)>0.6)close()}
    cur.push(f);
  }
  close();return segs;
}
// 音程の線を全体表示するグラフ（録音の振り返り・サイレン・音域用）
function drawTrace(canvas,pts,dur,o={}){
  const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w)return;
  canvas.width=w*dpr;canvas.height=h*dpr;const g=canvas.getContext('2d');g.scale(dpr,dpr);
  let lo=1e9,hi=-1e9;for(const p of pts)if(p.m!=null){if(p.m<lo)lo=p.m;if(p.m>hi)hi=p.m}
  if(lo>hi){lo=47;hi=60}
  lo=Math.floor(lo)-2;hi=Math.ceil(hi)+2;
  const span=hi-lo,x=t=>t/dur*w,y=m=>h-4-(m-lo)/span*(h-8);
  g.font='11px sans-serif';
  for(let k=lo+1;k<hi;k++){
    const pc=((k%12)+12)%12,lab=span<=13||(span<=27&&[0,4,7].includes(pc))||pc===0;
    g.strokeStyle=lab?'#2c333b':'#191e24';g.lineWidth=1;g.beginPath();g.moveTo(0,y(k));g.lineTo(w,y(k));g.stroke();
    if(lab){g.fillStyle='#7b8590';g.fillText(nn(k),4,y(k)-2)}
  }
  g.strokeStyle='#4fc3f7';g.lineWidth=2;g.lineJoin='round';g.beginPath();
  let prev=null;
  for(const p of pts){
    if(p.m==null){prev=null;continue}
    const xx=x(p.t),yy=y(p.m);
    if(prev==null||Math.abs(p.m-prev)>1.5)g.moveTo(xx,yy);else g.lineTo(xx,yy);
    prev=p.m;
  }
  g.stroke();
  for(const b of o.marks||[]){
    g.strokeStyle='#ef5350';g.lineWidth=1.5;g.setLineDash([4,3]);g.beginPath();g.moveTo(x(b.t),0);g.lineTo(x(b.t),h);g.stroke();g.setLineDash([]);
    g.fillStyle='#ef5350';g.fillText(nn(b.m),Math.min(x(b.t)+3,w-28),12);
  }
  if(o.playT!=null){g.strokeStyle='#fff';g.lineWidth=1.5;g.beginPath();g.moveTo(x(o.playT),0);g.lineTo(x(o.playT),h);g.stroke()}
}

/* ========== 音域チェック ========== */
function analyzeRange(frames){
  const bins={};
  for(const a of frames)if(a.f){const k=Math.round(f2m(a.f));bins[k]=(bins[k]||0)+1}
  const ks=Object.keys(bins).map(Number).filter(k=>bins[k]>=6);
  if(!ks.length)return null;
  return {lo:Math.min(...ks),hi:Math.max(...ks)};
}

/* ========== サイレン練習 ========== */
function analyzeSiren(arr){
  const v=arr.filter(a=>a.f).map(a=>({t:a.t,m:f2m(a.f)}));
  if(v.length<20)return null;
  const s=v.map(a=>a.m).sort((a,b)=>a-b),q=p=>s[Math.min(s.length-1,Math.floor(p*s.length))];
  const br=[];
  for(let i=1;i<v.length;i++){
    const dt=v[i].t-v[i-1].t,d=Math.abs(v[i].m-v[i-1].m);
    let kind=null;
    if(dt<0.08){if(d>1.5&&Math.abs(d-12)>1&&Math.abs(d-24)>1)kind='jump'}
    else if(dt<0.6)kind='gap';
    if(kind&&(!br.length||v[i].t-br[br.length-1].t>0.3))br.push({t:v[i-1].t,m:Math.round(v[i-1].m),kind});
  }
  return {lo:Math.round(q(0.02)),hi:Math.round(q(0.98)),breaks:br};
}

/* ========== リズム練習 ========== */
function drawBars(canvas,beats){
  const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;const g=canvas.getContext('2d');g.scale(dpr,dpr);
  const n=beats.length,bw=w/n,R=150,y=o=>h/2-clamp(o,-R,R)/R*(h/2-12);
  beats.forEach((b,i)=>{if(b.sil){g.fillStyle='#1a2029';g.fillRect(i*bw,0,bw,h)}});
  g.strokeStyle='#66bb6a';g.lineWidth=1.5;g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
  g.font='11px sans-serif';g.fillStyle='#7b8590';g.fillText('遅い ↑',4,12);g.fillText('早い ↓',4,h-4);
  beats.forEach((b,i)=>{
    if(b.off==null){g.fillStyle='#ef5350';g.fillText('×',i*bw+bw/2-3,h/2-3);return}
    g.fillStyle=Math.abs(b.off)<=30?'#66bb6a':Math.abs(b.off)<=60?'#ffb74d':'#ef5350';
    const yy=y(b.off);g.fillRect(i*bw+2,Math.min(yy,h/2),Math.max(1,bw-4),Math.max(2,Math.abs(yy-h/2)));
  });
}

      if(!sil)click(t,i<COUNT);
      if(k>=0)beats.push({t,sil});
    }
    taps=[];
    const end=t0+(COUNT+BEATS)*iv+0.4;
    while(S.ctx.currentTime<end){
      if(!alive())return;
      const k=Math.floor((S.ctx.currentTime-t0)/iv)-COUNT;
      stEl.textContent=k<-COUNT?'準備…':k<0?`準備 ${k+COUNT+1}/${COUNT}`:`${Math.min(k+1,BEATS)}/${BEATS}${beats[Math.min(k,BEATS-1)].sil?'（音なし・そのまま続けて）':''}`;
      await sleep(50);
    }
    const lat=st.latencyMs??0,tp=taps;taps=null;
    beats.forEach(b=>{
      let best=null;for(const t of tp){if(best==null||Math.abs(t-b.t)<Math.abs(best-b.t))best=t}
      b.off=best!=null&&Math.abs(best-b.t)<iv/2?(best-b.t)*1000-lat:null;
    });
    $('#start').disabled=false;$('#start').textContent='もう一度';stEl.textContent='';
    const got=beats.filter(b=>b.off!=null);
    if(got.length<BEATS*0.6){$('#res').innerHTML='<p class="warn">タップが少なすぎました。もう一度どうぞ。</p>';return}
    const cv=$('#cv');cv.style.display='block';drawBars(cv,beats);
    const offs=got.map(b=>b.off),aud=got.filter(b=>!b.sil).map(b=>b.off),sil=got.filter(b=>b.sil).map(b=>b.off);
    const s={bpm:Rm.bpm,mode:Rm.mode,n:got.length,bias:Math.round(median(offs)),sd:Math.round(std(offs)),
      sdAud:Math.round(std(aud)),sdSil:sil.length>3?Math.round(std(sil)):null,shift:sil.length>3?Math.round(median(sil)-median(aud)):null};
    DB.results.rhythm={...s,date:Date.now()};pushHist('rhythm',s);save();
    const tend=s.bias<-25?'<span class="warn">走り気味（早い）</span>':s.bias>25?'<span class="warn">もたり気味（遅い）</span>':'<span class="ok">ちょうど良い</span>';
    const sdc=s.sd<=25?'ok':s.sd<=45?'warn':'bad';
    $('#res').innerHTML=`<div class="card"><p>全体の傾向: <b>${s.bias>0?'+':''}${s.bias}ms</b>（${tend}）</p><p>ばらつき: <b class="${sdc}">${s.sd}ms</b></p>
      ${s.shift!=null?`<p>クリックが消えている間: ばらつき <b>${s.sdSil}ms</b>（鳴っている間 ${s.sdAud}ms）、タイミングは <b>${s.shift>0?'+':''}${s.shift}ms</b> ${Math.abs(s.shift)<=25?'で安定':s.shift<0?'＝音が消えると早くなる（走る）傾向':'＝音が消えると遅くなる（もたる）傾向'}</p>`:''}
      <p class="sub">グラフ: 1本が1拍。緑の線ぴったりが理想で、上が遅い・下が早い。暗い帯はクリックが消えていた拍。${st.latencyMs==null?'遅延キャリブレーションが未実施のため、早い・遅いの判定は参考値です。':'イヤホンの遅延は補正済みです。'}</p></div>`;
  };
};

function drawLine(canvas,vals,fmt){
  const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  canvas.width=w*dpr;canvas.height=h*dpr;const g=canvas.getContext('2d');g.scale(dpr,dpr);
  let lo=Math.min(...vals),hi=Math.max(...vals);if(hi-lo<1e-6){lo-=1;hi+=1}
  const pad=(hi-lo)*0.15;lo-=pad;hi+=pad;
  const L=44,x=i=>vals.length>1?L+i/(vals.length-1)*(w-L-12):(L+w-12)/2,y=v=>h-10-(v-lo)/(hi-lo)*(h-22);
  g.font='11px sans-serif';g.fillStyle='#7b8590';g.strokeStyle='#2c333b';
  for(const v of [Math.max(...vals),Math.min(...vals)]){g.beginPath();g.moveTo(L,y(v));g.lineTo(w,y(v));g.stroke();g.fillText(fmt(v),2,y(v)+4)}
  g.strokeStyle='#4fc3f7';g.lineWidth=2;g.beginPath();vals.forEach((v,i)=>i?g.lineTo(x(i),y(v)):g.moveTo(x(i),y(v)));g.stroke();
  g.fillStyle='#4fc3f7';vals.forEach((v,i)=>{g.beginPath();g.arc(x(i),y(v),3,0,7);g.fill()});
}

const ADV={
  ear:{t:'耳（聴き分け）を鍛える',b:['①の聴き分けテストを毎日1回。閾値の数字が下がっていくか見る','ピアノアプリで隣り合う2音を鳴らし、「上がった・下がった」を口に出して答える','歌う前に、基準音を頭の中で鳴らせるか確かめる（オーディエーション）']},
  monitor:{t:'自分の声を耳で追う力を鍛える',b:['④（見ながら）→③（見ずに）を交互に。画面で合った時の「感覚」と「聞こえ方」を結びつける','片手を耳の後ろに当てて歌うと、自分の声が聞こえやすくなる','フリー歌唱で録音し、聞き返して「どこでずれたか」を自分で当ててから画面で答え合わせ']},
  motor:{t:'狙った高さに声を持っていく練習',b:['小さめの声で合わせる（大声ほど音程は不安定になりやすい）','「ん〜」のハミングや「う」の母音で合わせると、ノドの余計な動きが減る','サイレン（低い音から高い音へ「う〜」とずり上げる）で、音の高さを滑らかに動かす感覚を作る']},
  breath:{t:'息の支えを安定させる',b:['「スー」と8〜10秒、一定の強さで息を吐く練習','ロングトーンの後半で下がる人は、息を最後まで同じ速さで出すことを意識']},
  tension:{t:'力みを抜く',b:['肩・首・アゴの力を抜いてから歌い出す。上がりやすい人は力みのサインのことが多い','高い音ほど「軽く」出す意識で。ハミングから入ると力みにくい']},
  flat:{t:'低めに外れるクセへの対策',b:['声を出す前に目標の音を頭の中で鳴らしてから出す','「い」「え」など明るい母音、口角を上げて歌う','息の量不足で下がることが多いので、出だしの息をしっかり']},
  sharp:{t:'高めに外れるクセへの対策',b:['力みで上ずりやすいので、肩と首を緩めて小さめの声で','目標より少し下から「置きにいく」より、静かに真ん中を狙う']},
  scoop:{t:'出だしのずれ（しゃくり）への対策',b:['声を出す前に頭の中で目標の音を鳴らし、出だしから当てる','ハミングで音を当ててから口を開けて母音にする']},
  range:{t:'音域の端で音程が寄るクセへの対策',b:['高い音が低め・低い音が高めになりやすい状態。設定で音域を端に寄せて重点練習','高音は軽い声（ハミングや裏声寄り）から始めると当てやすい']},
};
function diagnose(){
  const R=DB.results,out=[],adv=[],add=k=>{if(!adv.includes(k))adv.push(k)},issues=[];
  if(R.disc){
    const T=R.disc.thr;let lv='ok',t;
    if(T<=25)t='細かい音程差まで聞き分けられています。耳の分解能は問題なさそうです。';
    else if(T<=60)t='一般的な範囲です。さらに細かい差は練習で伸ばせます。';
    else if(T<=150){lv='warn';t='聞き分けがやや粗めです。耳のトレーニングの効果が出やすい状態です。';add('ear');issues.push('耳（聴き分け）')}
    else{lv='bad';t='音の高い・低いの判断で迷いやすい状態です。まず聴き分けの練習を優先しましょう。';add('ear');issues.push('耳（聴き分け）')}
    out.push({k:'① 聴き分け',v:`約${T}セント`,lv,t});
  }
  if(R.longtone){
    const s=R.longtone.sd,dr=R.longtone.drift;let lv='ok',t;
    if(s<=12)t='声はまっすぐ安定して伸ばせています。';
    else if(s<=25){lv='ok';t='おおむね安定しています。';}
    else{lv='warn';t='伸ばしている間の揺れが大きめです。息やノドのコントロールに伸びしろがあります。';add('breath');issues.push('声の安定（息・ノド）')}
    if(dr<-8){t+=' 伸ばすうちに音が下がっていく傾向があります。';add('breath')}
    else if(dr>8){t+=' 伸ばすうちに音が上がっていく傾向があります。';add('tension')}
    out.push({k:'② ロングトーン',v:`揺れ ${Math.round(s)}セント`,lv,t});
  }
  const A=R.match?.mae,B=R.matchVis?.mae;
  if(R.match){
    const lv=A<=25?'ok':A<=50?'warn':'bad';
    out.push({k:'③ 聞いてから歌う',v:`平均 ${Math.round(A)}セント`,lv,t:A<=25?'聞いた音を正確に再現できています。':A<=50?'だいたい合っていますが、ずれが目立つ音があります。':'聞いた音とのずれが大きめです。'});
  }
  if(R.match&&R.matchVis){
    let lv='ok',t;
    if(A<=25&&B<=25)t='見ても見なくても安定して合わせられています。';
    else if(A-B>=15&&B<=40){lv='warn';t='画面を見ると合わせられる＝狙った高さに声を出す力はあります。主な課題は、自分の声を耳で追って修正する力（セルフモニタリング）です。';add('monitor');issues.push('自分の声を聞く力')}
    else if(B>40){lv='warn';t='画面を見ても合わせにくい＝狙った高さに声を持っていく発声コントロール（運動側）が主な課題です。';add('motor');issues.push('発声コントロール（出す側）')}
    else{lv='warn';t='見ても見なくても同じくらいずれます。聞く側・出す側の両方を少しずつ鍛えましょう。';add('monitor');add('motor');issues.push('聞く側と出す側の両方')}
    out.push({k:'③と④の比較',v:`${Math.round(A)} → ${Math.round(B)}セント`,lv,t});
  }else if(R.matchVis){
    out.push({k:'④ 見ながら歌う',v:`平均 ${Math.round(B)}セント`,lv:B<=25?'ok':'warn',t:'③も実施すると、聞く側・出す側の切り分けができます。'});
  }
  const M=[R.match,R.matchVis].filter(Boolean);
  if(M.length){
    const all=M.flatMap(m=>m.trials||[]);
    const bias=mean(all.map(t=>t.err)),scoop=median(all.map(t=>t.on-t.err));
    const center=(DB.settings.low+DB.settings.high)/2;
    const slope=all.length>=6?linreg(all.map(t=>t.m-center),all.map(t=>t.err)):0;
    const octs=M.reduce((s,m)=>s+(m.octs||0),0);
    const notes=[];
    if(bias<-20){notes.push(`全体に<b>低め</b>に外れる傾向（${fmtC(bias)}）`);add('flat')}
    else if(bias>20){notes.push(`全体に<b>高め</b>に外れる傾向（${fmtC(bias)}）`);add('sharp')}
    if(scoop<-30){notes.push(`出だしが低く、後から合わせにいく傾向（しゃくり、平均${fmtC(scoop)}）`);add('scoop')}
    else if(scoop>30){notes.push(`出だしが高く、後から下げる傾向（平均${fmtC(scoop)}）`);add('scoop')}
    if(slope<-4){notes.push('高い音ほど低め・低い音ほど高めになる＝楽な音域に引っ張られる傾向');add('range')}
    if(octs>=2)notes.push(`1オクターブずれて歌った音が${octs}回（男性では自然なことも多いので問題ではありません）`);
    if(notes.length)out.push({k:'ずれ方のクセ',v:'',lv:'warn',t:notes.join('<br>')});
  }
  if(R.onset){
    const o=R.onset,rate=o.straight/o.n;let lv=rate>=0.7?'ok':rate>=0.4?'warn':'bad',t;
    t=`10音中、出だしから目標±30セント以内に入れたのは${o.straight}音。出だしのずれは中央値${fmtC(o.onMed)}${o.settleMed!=null?`、正しい高さに入るまで約${o.settleMed}ms`:''}。`;
    if(o.onMed<-30){t+='下から入ってすくい上げる傾向（しゃくり）があります。';add('scoop')}
    else if(o.onMed>30){t+='上から入って下げる傾向があります。';add('scoop')}
    out.push({k:'🎯 出だし',v:`まっすぐ ${o.straight}/${o.n}`,lv,t});
  }
  if(R.phrase){
    const q=R.phrase,rate=q.straight/q.n;let lv=rate>=0.7?'ok':rate>=0.4?'warn':'bad';
    let t=`${q.notesPer}音×テンポ${q.bpm}で、出だしから当てられた音は${q.straight}/${q.n}音、最終的に合った音は${q.landed}/${q.n}音。`;
    if(q.firstAbs!=null&&q.laterAbs!=null){
      t+=`<br>出だしのずれ（中央値）: 1音目 ${Math.round(q.firstAbs)}セント → 2音目以降 ${Math.round(q.laterAbs)}セント。`;
      if(q.laterAbs-q.firstAbs>=20)t+='音が移動した後の方がずれが大きく、「次の音を出す前に決める」部分が課題です。';
    }
    if(q.stepAbs!=null&&q.leapAbs!=null)t+=`<br>隣の音への移動 ${Math.round(q.stepAbs)}セント ／ 跳躍（3半音以上） ${Math.round(q.leapAbs)}セント。`;
    if(rate<0.7)add('scoop');
    out.push({k:'🎼 フレーズ',v:`まっすぐ ${q.straight}/${q.n}`,lv,t});
  }
  if(R.interval){
    const q=R.interval,rate=q.straight/q.n,w=q.worst;
    out.push({k:'🎹 音階・音程',v:`まっすぐ ${q.straight}/${q.n}`,lv:rate>=0.7?'ok':rate>=0.4?'warn':'bad',
      t:`${PAT[q.pat]?.name||''}で、出だしから当てられた音は${q.straight}/${q.n}音。`+(w&&w.on>30?`いちばん苦手な動きは<b>${mvName(w.d)}</b>（出だしのずれ ${w.on}セント）。`:'苦手な動きは特に見当たりません。')});
  }
  if(R.unison){
    const u=R.unison;let t=`基準音と同時に歌ったときの平均ずれ ${Math.round(u.mae)}セント、合っていた時間 ${u.within}%。`;
    if(R.match&&u.mae-R.match.mae>=15){t+='音が鳴っていない時より大きくずれます。伴奏の中で自分の声を聞き取るのが課題です。';add('monitor')}
    out.push({k:'👥 一緒に歌う',v:`平均 ${Math.round(u.mae)}セント`,lv:u.mae<=25?'ok':'warn',t});
  }
  if(R.range)out.push({k:'📏 音域',v:`${nn(R.range.lo)}〜${nn(R.range.hi)}`,lv:'ok',t:`今の声で出せる範囲は${R.range.hi-R.range.lo}半音（約${((R.range.hi-R.range.lo)/12).toFixed(1)}オクターブ）です。`});
  if(R.siren)out.push({k:'🚨 サイレン',v:`${nn(R.siren.lo)}〜${nn(R.siren.hi)}`,lv:R.siren.breaks.length?'warn':'ok',t:R.siren.breaks.length?`${R.siren.breaks.map(nn).join('・')}付近で声が切り替わり・途切れています。この高さの少し下から、軽い声で通過する練習が有効です。`:'低音から高音まで切れ目なくつながっています。'});
  if(R.rhythm){
    const r=R.rhythm;let t=`♩=${r.bpm}でのばらつき ${r.sd}ms、傾向 ${r.bias>0?'+':''}${r.bias}ms（${r.bias<-25?'走り気味':r.bias>25?'もたり気味':'ちょうど良い'}）。`;
    if(r.shift!=null&&Math.abs(r.shift)>25)t+=`クリックが消えると${r.shift<0?'早く':'遅く'}なる傾向があります。`;
    out.push({k:'🥁 リズム練習',v:`ばらつき ${r.sd}ms`,lv:r.sd<=25?'ok':r.sd<=45?'warn':'bad',t});
  }
  if(R.calib){const sd=R.calib.sd;out.push({k:'リズム（タップ）',v:`ばらつき ${sd}ms`,lv:sd<=35?'ok':'warn',t:sd<=20?'リズムはとても安定しています。':sd<=35?'リズムは安定しています。':'タップのタイミングにばらつきがあります。今後のリズム練習モードで鍛えられます。'})}
  return {out,adv,issues};
}

  <p class="sub">※この診断は簡易的な目安で、医学的な評価ではありません。体調や環境（雑音・イヤホン）で結果は変わるので、数日おきに繰り返して傾向を見てください。</p>
  <button id="copy">結果をテキストでコピー</button><div id="cp"></div>
  <button data-go="home">ホームへ</button>`;
  $('#copy').onclick=()=>{
    const st=DB.settings;
    const lines=[`【音程トレーナー診断結果】${new Date().toLocaleString('ja-JP')}`,`音域設定: ${nn(st.low)}〜${nn(st.high)} / 基準音: ${st.timbre}`];
    out.forEach(o=>lines.push(`■${o.k} ${o.v}\n  ${o.t.replace(/<br>/g,'\n  ').replace(/<[^>]+>/g,'')}`));
    ['match','matchVis'].forEach(k=>{if(R[k])lines.push(`${k==='match'?'③':'④'}詳細: `+R[k].trials.map(t=>`${nn(t.m)}:${t.err>0?'+':''}${t.err}(出だし${t.on>0?'+':''}${t.on})`).join(', '))});
    if(R.longtone)lines.push(`②詳細: 揺れ${Math.round(R.longtone.sd)}セント 変化${R.longtone.drift.toFixed(1)}セント/秒 音:${(R.longtone.notes||[]).join(',')}`);
    if(R.calib)lines.push(`遅延: ${R.calib.latency}ms ばらつき${R.calib.sd}ms`);
    if(R.onset)lines.push(`出だし詳細: `+R.onset.trials.map(t=>`${nn(t.m)}:出だし${t.on>0?'+':''}${t.on}→${t.fin>0?'+':''}${t.fin}(${t.settle==null?'未到達':t.settle+'ms'})`).join(', '));
    if(R.phrase)lines.push(`フレーズ: ${R.phrase.notesPer}音 BPM${R.phrase.bpm} まっすぐ${R.phrase.straight}/${R.phrase.n} 着地${R.phrase.landed}/${R.phrase.n} 出だし|中央値| 1音目${Math.round(R.phrase.firstAbs??0)} 以降${Math.round(R.phrase.laterAbs??0)} 隣${Math.round(R.phrase.stepAbs??0)} 跳躍${Math.round(R.phrase.leapAbs??0)}`);
    if(R.interval)lines.push(`音階・音程詳細(${R.interval.pat}): `+R.interval.by.map(b=>`${mvName(b.d)}:出だし${b.on}/着地${b.fin}(${b.n}回)`).join(', '));
    if(R.siren)lines.push(`サイレン詳細: ${nn(R.siren.lo)}〜${nn(R.siren.hi)} 切り替わり:${R.siren.breaks.map(nn).join(',')||'なし'}`);
    if(R.rhythm)lines.push(`リズム詳細: BPM${R.rhythm.bpm} ${R.rhythm.mode} 傾向${R.rhythm.bias}ms ばらつき${R.rhythm.sd}ms 無音時${R.rhythm.sdSil??'-'}ms ずれ${R.rhythm.shift??'-'}ms`);
    if(R.free)lines.push(`フリー歌唱: ${R.free.notes}音 平均ずれ${Math.round(R.free.mae)}セント 傾向${Math.round(R.free.bias)} ±25以内${R.free.within}%`);
    const txt=lines.join('\n');
    const fallback=()=>{$('#cp').innerHTML='<textarea readonly></textarea><p class="sub">上の文字を長押しでコピーしてください。</p>';$('#cp textarea').value=txt};
    try{navigator.clipboard.writeText(txt).then(()=>{$('#copy').textContent='コピーしました ✓'},fallback)}catch(e){fallback()}
  };
};

/* ========== 設定 ========== */
VIEWS.settings=()=>{
  const st=DB.settings,opts=sel=>{let h='';for(let m=36;m<=79;m++)h+=`<option value="${m}"${m===sel?' selected':''}>${nn(m)}（${nnj(m)}） ${Math.round(m2f(m))}Hz</option>`;return h};
  app.innerHTML=hdr('設定')+`<div class="card">
  <label>練習音域（下）</label><select id="low">${opts(st.low)}</select>
  <label>練習音域（上）</label><select id="high">${opts(st.high)}</select>
  <p class="sub">③④で出題する範囲です。最初は「楽に出せる範囲」に。慣れたら上を少しずつ広げてください。男性の目安: C3〜E4。</p>
  <label>基準音の音色</label><select id="tim">
    <option value="voice"${st.timbre==='voice'?' selected':''}>声っぽい（おすすめ）</option>
    <option value="piano"${st.timbre==='piano'?' selected':''}>ピアノ風（減衰する）</option>
    <option value="sine"${st.timbre==='sine'?' selected':''}>純音（ピー音）</option></select>
  <button id="test">音色を試聴</button>
  <label>基準音の音量 <span id="vv">${Math.round(st.vol*100)}%</span></label><input type="range" id="vol" min="0.1" max="1.5" step="0.05" value="${st.vol}">
  <label>声の検出しきい値 <span id="gv">${st.gate}</span></label><input type="range" id="gate" min="0.002" max="0.05" step="0.001" value="${st.gate}">
  <p class="sub">声を出しても音名が出ない→下げる。何もしていないのに反応する→上げる。</p>
  <label>遅延補正（ms）</label><select id="lat">${[0,50,100,150,200,250,300,350,400].map(v=>`<option${v===Math.round((st.latencyMs??200)/50)*50?' selected':''}>${v}</option>`).join('')}</select>
  <p class="sub">通常はキャリブレーションで自動設定されます（現在 ${st.latencyMs??'未測定（200として動作）'}）。</p>
  </div>
  <div class="card"><button id="reset" style="background:#4a2326">記録をすべて消去</button><p id="rs" class="sub"></p></div>`;
  const upd=()=>{
    let lo=+$('#low').value,hi=+$('#high').value;if(hi<lo){[lo,hi]=[hi,lo]}
    Object.assign(st,{low:lo,high:hi,timbre:$('#tim').value,vol:+$('#vol').value,gate:+$('#gate').value});
    $('#vv').textContent=Math.round(st.vol*100)+'%';$('#gv').textContent=st.gate;save();
  };
  ['low','high','tim','vol','gate'].forEach(id=>$('#'+id).addEventListener('input',upd));
  $('#lat').onchange=()=>{st.latencyMs=+$('#lat').value;save()};
  $('#test').onclick=async()=>{upd();await ensureAudio();playTone(m2f(st.low),1.0)};
  let armed=false;
  $('#reset').onclick=()=>{
    if(!armed){armed=true;$('#rs').innerHTML='<span class="warn">もう一度押すと、すべての記録を消去します（設定は残ります）。</span>';return}
    DB.results={};DB.history=[];save();$('#rs').textContent='消去しました。';armed=false;
  };
};

go('home');
</script>
