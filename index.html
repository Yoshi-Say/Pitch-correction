<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="音楽トレーニング">
<meta name="theme-color" content="#111418">
<title>音楽トレーニング</title>
<style>
:root{--bg:#111418;--card:#1b2026;--fg:#e8eaed;--sub:#9aa3ad;--acc:#4fc3f7}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0 auto;max-width:560px;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.55;
  padding:calc(env(safe-area-inset-top) + 16px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 14px)}
h1{font-size:23px;margin:4px 0 2px} h2{font-size:13px;color:var(--sub);font-weight:600;margin:20px 0 6px;letter-spacing:.08em}
p{margin:4px 0}.sub{color:var(--sub);font-size:13px}
a.app{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:14px;margin:8px 0;color:var(--fg);text-decoration:none}
a.app:active{background:#252c34}
.ic{flex:0 0 52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center}
.tx{flex:1;min-width:0}.tx b{font-size:16px}.tx p{color:var(--sub);font-size:12.5px;line-height:1.45}
.st{font-size:12px;color:var(--acc);margin-top:3px}
.chev{color:#56606b;font-size:22px}
</style>
</head>
<body>
<h1>音楽トレーニング</h1>
<p class="sub">歌・ギター・リズムの練習ツールです。記録はこのiPhoneのブラウザ内に保存されます。</p>

<h2>歌</h2>
<a class="app" href="pitch.html"><div class="ic" style="background:#16384a"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#4fc3f7" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg></div>
  <div class="tx"><b>音程トレーナー</b><p>診断テスト、出だし・フレーズ練習、サイレン、音域チェック、録音の聞き返し</p><div class="st" id="s-pitch"></div></div><span class="chev">›</span></a>

<h2>ギター</h2>
<a class="app" href="strum.html"><div class="ic" style="background:#3d2f17"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffb74d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v14M3.5 14.5 7 18l3.5-3.5M17 20V6M13.5 9.5 17 6l3.5 3.5"/></svg></div>
  <div class="tx"><b>ストローク トレーナー</b><p>テンポとパターンを決めて弾き、1打ごとのずれとコード／ミュートの弾き分けを評価</p><div class="st" id="s-strum"></div></div><span class="chev">›</span></a>
<a class="app" href="guitar.html"><div class="ic" style="background:#3d2f17"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#ffb74d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h3l2-6 3 12 3-9 2 5 2-2h5"/></svg></div>
  <div class="tx"><b>リズムチェッカー</b><p>自由に弾いて、テンポが一定に保てているか（走り・もたり）を確認</p><div class="st" id="s-guitar"></div></div><span class="chev">›</span></a>

<h2>リズム</h2>
<a class="app" href="drum.html"><div class="ic" style="background:#3a1f2b"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#f06292" stroke-width="1.8" stroke-linecap="round"><ellipse cx="12" cy="9" rx="8" ry="3.2"/><path d="M4 9v7c0 1.8 3.6 3.2 8 3.2s8-1.4 8-3.2V9M8 12v6.8M16 12v6.8M3 3l7 5M21 3l-7 5"/></svg></div>
  <div class="tx"><b>ドラム リズムトレーナー</b><p>流れる譜面に合わせてドラムを叩き、何ms早い・遅いかを分析（10レベル）</p><div class="st" id="s-drum"></div></div><span class="chev">›</span></a>

<script>
const get=k=>{try{return JSON.parse(localStorage.getItem(k))||{}}catch(e){return {}}},set=(id,t)=>{if(t)document.getElementById(id).textContent=t};
const d=t=>{const x=new Date(t);return (x.getMonth()+1)+'/'+x.getDate()};
try{
  const p=get('pitchTrainer.v1'),ph=p.history||[];if(ph.length){const l=ph[ph.length-1],r=p.results||{};
    set('s-pitch',`最終 ${d(l.date)}・記録 ${ph.length}件${r.onset?`・出だし ${r.onset.straight}/${r.onset.n}`:''}${r.match?`・音程ずれ ${Math.round(r.match.mae)}セント`:''}`)}
  const s=get('strumTrainer.v1').hist||[];if(s.length){const l=s[s.length-1];set('s-strum',`最終 ${d(l.date)}・♩=${l.bpm}・${l.score}点・ばらつき ${l.sd}ms`)}
  const g=get('guitarRhythm.v1').hist||[];if(g.length){const l=g[g.length-1];set('s-guitar',`最終 ${d(l.date)}・♩=${l.bpm}・ばらつき ${l.jit}ms・変化 ${l.drift>0?'+':''}${l.drift}%`)}
  const dr=get('drumTrainer.v1').hist||[];if(dr.length){const l=dr[dr.length-1];set('s-drum',`最終 ${d(l.date)}・Lv${l.lv+1}・${l.score}点・ばらつき ${l.sd}ms`)}
}catch(e){}
</script>
</body>
</html>
