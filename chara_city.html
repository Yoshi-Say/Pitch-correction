<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>こえのすけ CITY - 声で進む音程トレーナー（試作）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
  :root{ --ink:#2a1f3d; --accent:#ffcf5a; --pink:#ff6f91; --text:#f6f1ff; --sub:#c9bfe6; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#120d22;color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  header{padding:8px 10px;background:linear-gradient(180deg,rgba(40,28,70,.95),rgba(26,18,48,.95));
    border-bottom:1px solid rgba(255,255,255,.08);box-shadow:0 4px 18px rgba(0,0,0,.35);z-index:2}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .row+.row{margin-top:6px}
  h1{font-family:"DotGothic16",monospace;font-size:17px;margin:0 6px 0 0;color:var(--accent);font-weight:normal;
    letter-spacing:.06em;text-shadow:0 0 10px rgba(255,207,90,.55)}
  select,button{font-family:inherit;font-size:12px;border-radius:999px;padding:5px 9px;color:var(--text);
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);max-width:100%;
    -webkit-appearance:none;appearance:none}
  select{padding-right:12px}
  #ex{max-width:48vw}
  button{transition:transform .08s}
  button:active{transform:scale(.96)}
  button.primary{background:linear-gradient(135deg,#ffd66e,#ff9f6b);color:#2a1a10;border:none;font-weight:700;
    box-shadow:0 0 14px rgba(255,180,100,.45)}
  button:disabled{opacity:.4;box-shadow:none}
  label.tg{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px}
  .key{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub)}
  .key button{padding:3px 10px}
  #stage{flex:1;position:relative;background:#000}
  #stage > canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;right:0;bottom:12px;text-align:center;font-size:14px;color:#fff;
    pointer-events:none;text-shadow:0 0 8px rgba(0,0,0,.9)}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,6,24,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:16px}
  #card{background:linear-gradient(160deg,rgba(60,40,100,.92),rgba(30,20,60,.94));color:#fff;width:min(420px,100%);
    padding:20px 18px 16px;text-align:center;border-radius:22px;border:1px solid rgba(255,255,255,.14);
    box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 40px rgba(255,111,145,.15)}
  #card .small{font-size:12px;color:var(--sub)}
  #card .type{font-family:"DotGothic16",monospace;font-size:26px;margin:6px 0 2px;color:var(--accent);
    text-shadow:0 0 14px rgba(255,207,90,.6)}
  #card .score{font-size:48px;font-weight:800;line-height:1.1}
  #card .advice{font-size:14px;margin:12px 0;line-height:1.7;text-align:left;background:rgba(255,255,255,.07);
    border-radius:12px;padding:10px 12px}
  #bars{display:flex;gap:5px;align-items:flex-end;height:56px;margin:6px 0 20px}
  #bars div{flex:1;position:relative;border-radius:6px 6px 2px 2px}
  #bars span{position:absolute;bottom:-17px;left:0;right:0;font-size:11px;color:var(--sub)}
  #card .btns{display:flex;gap:10px;justify-content:center}
  #startCover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:20px;
    background:radial-gradient(circle at 50% 35%,#4a2f7a 0%,#24173f 55%,#120d22 100%)}
  #startCover .title{font-family:"DotGothic16",monospace;font-size:34px;color:var(--accent);letter-spacing:.1em;
    text-shadow:0 0 18px rgba(255,207,90,.7),0 0 40px rgba(255,111,145,.4)}
  #startCover p{color:var(--sub);font-size:14px;line-height:1.8;margin:0}
  #startCover button{font-size:16px;padding:12px 26px}
  #coverChara{width:96px;height:96px;image-rendering:pixelated;filter:drop-shadow(0 0 14px rgba(255,207,150,.7))}
  .blink{animation:bl 1.2s ease-in-out infinite}
  @keyframes bl{50%{opacity:.3}}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="row">
      <h1>こえのすけ</h1>
      <select id="voice">
        <option value="48">低い声（男性）</option>
        <option value="57">中くらい</option>
        <option value="60">高い声（女性）</option>
      </select>
      <select id="ex"></select>
    </div>
    <div class="row">
      <select id="level">
        <option value="50">やさしい</option>
        <option value="35" selected>ふつう</option>
        <option value="20">きびしい</option>
      </select>
      <div class="key">キー<button id="kDown">−</button><span id="kVal">0</span><button id="kUp">＋</button></div>
      <label class="tg"><input type="checkbox" id="guide" checked>お手本</label>
      <label class="tg"><input type="checkbox" id="beat" checked>ビート</label>
      <label class="tg"><input type="checkbox" id="accomp" checked>伴奏</label>
      <label class="tg"><input type="checkbox" id="lite">軽量</label>
      <select id="sens" title="マイク感度"><option value="high">感度：高</option><option value="mid" selected>感度：中</option><option value="low">感度：低</option></select>
      <button id="go" class="primary" disabled>▶ スタート</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="overlay"><div id="card"></div></div>
    <div id="startCover">
      <canvas id="coverChara" width="32" height="32"></canvas>
      <div class="title">こえのすけ</div>
      <p>声が高いと上へ、低いと下へ。<br>流れてくる雲の足場に、こえのすけを乗せ続けよう！<br><span style="font-size:12px">※イヤホン推奨</span></p>
      <button id="micBtn" class="primary"><span class="blink">▶</span> マイクをONにする</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// ===== 設定 =====
const NOTE_NAMES = ['ド','ド#','レ','レ#','ミ','ファ','ファ#','ソ','ソ#','ラ','ラ#','シ'];
const EXERCISES = {
  scale: { name: 'ドレミ 上がって下がる', seq: [0,2,4,5,7,5,4,2,0], dur: 2 },
  jump:  { name: 'とびとび（ド・ミ・ソ）', seq: [0,4,7,4,0,7,0],     dur: 2 },
  high:  { name: '高音チャレンジ',         seq: [0,4,7,12,11,7,4,0], dur: 2 },
  long:  { name: 'ロングトーン',           seq: [0,7,4,0],           dur: 4 },
};
const BPM = 100, BEAT = 60 / BPM;              // テンポ（音の長さは拍で決める）
const GUIDE_LEAD = 2 * BEAT, GUIDE_LEN = 0.9 * BEAT, GAP = 2 * BEAT;
const GATE_MIN = { high: 0.002, mid: 0.004, low: 0.01 };   // 感度ごとの最低ライン
let noiseFloor = 0.003, gateNow = 0.012;              // 周りの雑音の大きさを常に学習して、しきい値を自動で上げ下げ
const SCROLL_PX = 150;       // 練習中のスクロール速度(CSS px/秒)
const FREE_SCROLL = 45;      // 自由モードのスクロール速度
const FONT = '"DotGothic16", ui-monospace, monospace';

// ===== ドット絵（16x16） =====
// o:輪郭 b:体 h:ハイライト n:音符アンテナ f:足
const BODY = [
  '..........nnn...',
  '..........n..n..',
  '..........n.....',
  '.....oooooo.....',
  '...oobbbbbboo...',
  '..obhhbbbbbbbo..',
  '.obhbbbbbbbbbbo.',
  '.obbbbbbbbbbbbo.',
  'obbbbbbbbbbbbbbo',
  'obbbbbbbbbbbbbbo',
  'obbbbbbbbbbbbbbo',
  'obbbbbbbbbbbbbbo',
  '.obbbbbbbbbbbbo.',
  '.obbbbbbbbbbbbo.',
  '..oobbbbbbbboo..',
  '...offo..offo...',
];
const FEET_B = '....offo..offo..';
const PAL = { o:'#3b2a4a', b:'#ffe3c2', h:'#ffffff', n:'#ff6f91', f:'#c97a5a' };
const INK = '#3b2a4a', CHEEK = '#ff9eb0', MOUTH = '#b3364c';
// 顔パーツ（[x,y,色]の配列）
const FACES = {
  normal: [[5,9],[5,10],[10,9],[10,10],[7,12],[8,12]],
  blink:  [[4,10],[5,10],[6,10],[9,10],[10,10],[11,10],[7,12],[8,12]],
  happy:  [[4,10],[5,9],[6,10],[9,10],[10,9],[11,10],[6,11,MOUTH],[7,11,MOUTH],[8,11,MOUTH],[9,11,MOUTH],[7,12,MOUTH],[8,12,MOUTH]],
  high:   [[4,8],[5,8],[4,9],[5,9],[10,8],[11,8],[10,9],[11,9],[7,11,MOUTH],[8,11,MOUTH],[7,12,MOUTH],[8,12,MOUTH]],
  low:    [[5,9],[5,10],[10,9],[10,10],[6,12],[7,11],[8,12],[9,11]],
  sing:   [[5,9],[5,10],[10,9],[10,10],[7,11,MOUTH],[8,11,MOUTH],[7,12,MOUTH],[8,12,MOUTH]],
  sleep:  [[4,10],[5,10],[6,10],[9,10],[10,10],[11,10],[7,12],[8,12]],
};
const CHEEKS = [[3,11],[4,11],[11,11],[12,11]];

// ===== 要素 =====
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const exSel = $('ex');
for (const [k, v] of Object.entries(EXERCISES)) {
  const o = document.createElement('option'); o.value = k; o.textContent = v.name; exSel.appendChild(o);
}
let keyShift = 0;
$('kDown').onclick = () => { keyShift = Math.max(-6, keyShift - 1); $('kVal').textContent = keyShift; };
$('kUp').onclick   = () => { keyShift = Math.min( 6, keyShift + 1); $('kVal').textContent = keyShift; };

// ===== 32ドットのこえのすけ v3（ヘッドホン・前髪・服の一体感） =====
const SPR_CACHE = {};
function makeSprite32(face, walking) {
  const key = face + (walking ? 'w' : '');
  if (SPR_CACHE[key]) return SPR_CACHE[key];
  const cv2 = document.createElement('canvas'); cv2.width = cv2.height = 32;
  const x = cv2.getContext('2d');
  const OUT = '#3b2a4a', W = '#ffffff';
  const px = (i, j, col) => { if (i < 0 || j < 0 || i > 31 || j > 31) return; x.fillStyle = col; x.fillRect(i, j, 1, 1); };
  const rect = (i, j, w, h, col) => { x.fillStyle = col; x.fillRect(i, j, w, h); };
  const ell = (cx, cy, rx, ry) => (i, j) => { const dx = (i + 0.5 - cx) / rx, dy = (j + 0.5 - cy) / ry; return dx * dx + dy * dy <= 1; };
  const tone = (T, d, i, j) => {
    let col = d > 0.5 ? T[0] : d > -0.25 ? T[1] : d > -0.6 ? T[2] : T[3];
    if (Math.abs(d - 0.5) < 0.07 && (i + j) % 2) col = T[1];
    if (Math.abs(d + 0.25) < 0.07 && (i + j) % 2) col = T[2];
    return col;
  };
  function shade(inside, T, cx, cy, rx, ry, outline = true) {
    for (let j = 0; j < 32; j++) for (let i = 0; i < 32; i++) {
      if (!inside(i, j)) continue;
      if (outline && (!inside(i - 1, j) || !inside(i + 1, j) || !inside(i, j - 1) || !inside(i, j + 1))) { px(i, j, OUT); continue; }
      px(i, j, tone(T, -0.6 * (i + 0.5 - cx) / rx - 0.8 * (j + 0.5 - cy) / ry, i, j));
    }
  }
  const SKIN  = ['#fff4e6', '#ffe3c2', '#f6c9a2', '#e2a982'];
  const SHIRT = ['#9cbcff', '#6a94ff', '#4a6fe0', '#3653b8'];
  const PINK  = ['#ffc2da', '#ff86b4', '#e2608f', '#b8456f'];
  const HAIR  = ['#c98a62', '#a0684a', '#7c4c38', '#5a3428'];
  const BAND  = ['#cbbcff', '#9a82f5', '#7c62e0', '#5c45b8'];

  // 足
  const fo = walking ? 1 : 0;
  for (const [a, b] of [[10 + fo, 14 + fo], [17 - fo, 21 - fo]]) {
    for (let i = a; i <= b; i++) for (let j = 28; j <= 31; j++) {
      if ((i === a || i === b) && (j === 28 || j === 31)) continue;
      const edge = i === a || i === b || j === 28 || j === 31;
      px(i, j, edge ? OUT : (j === 29 ? '#7a5a8a' : '#5a3f6a'));
    }
  }
  // 腕（そで＋手）→ 体 の順に重ねて付け根を隠す
  for (const [sx, hx] of [[8.6, 7.4], [23.4, 24.6]]) {
    shade(ell(sx, 24.2, 2.8, 2.8), SHIRT, sx, 24.2, 2.8, 2.8);
    shade(ell(hx, 26.6, 1.9, 1.7), SKIN, hx, 26.6, 1.9, 1.7);
  }
  const body = ell(16, 25, 8.2, 5.4);
  shade(body, SHIRT, 16, 25, 8.2, 5.4);
  // 頭
  const head = ell(16, 12, 11.8, 9.8);
  shade(head, SKIN, 16, 12, 11.8, 9.8);
  // あごの下の影（頭と体をつなげる）
  for (let i = 0; i < 32; i++) for (let j = 18; j < 28; j++) {
    if (body(i, j) && !head(i, j) && head(i, j - 1) && body(i - 1, j) && body(i + 1, j)) { px(i, j, SHIRT[3]); if (body(i, j + 1)) px(i, j + 1, SHIRT[2]); }
  }
  // 襟（あごに沿って白い襟）
  for (const [i, j] of [[10,21],[11,22],[12,22],[13,23],[14,23],[22,21],[21,22],[20,22],[19,23],[18,23]]) px(i, j, W);
  for (const [i, j] of [[10,22],[11,23],[12,23],[13,24],[14,24],[22,22],[21,23],[20,23],[19,24],[18,24]]) px(i, j, '#c9d2f0');
  // 胸の音符ボタン
  px(16, 25, '#ffd36b'); px(16, 26, '#e0a83a'); px(16, 28, '#ffd36b');
  // 前髪とサイドの髪
  const hairLine = i => (i <= 6 || i >= 25) ? 15.5 : 6.8 + 1.6 * Math.abs(Math.sin((i - 3.5) * 0.62));
  for (let j = 0; j < 32; j++) for (let i = 0; i < 32; i++) {
    if (!head(i, j) || j > hairLine(i)) continue;
    const onEdge = !head(i - 1, j) || !head(i + 1, j) || !head(i, j - 1);
    if (onEdge) { px(i, j, OUT); continue; }
    const tip = j + 1 > hairLine(i);
    px(i, j, tip ? HAIR[3] : tone(HAIR, -0.6 * (i + 0.5 - 16) / 11.8 - 0.8 * (j + 0.5 - 12) / 9.8, i, j));
  }
  px(9, 4, '#e8b48e'); px(10, 4, '#e8b48e'); px(11, 5, '#e8b48e');            // 髪のつや
  // ヘッドバンド
  const outer = ell(16, 12.6, 13.9, 12.4), inner = ell(16, 12.6, 12.1, 10.0);
  const band = (i, j) => j <= 9 && outer(i, j) && !inner(i, j);
  for (let j = 0; j <= 9; j++) for (let i = 0; i < 32; i++) {
    if (!band(i, j)) continue;
    const edge = !band(i, j - 1) || !band(i - 1, j) || !band(i + 1, j) || (!band(i, j + 1) && j < 8 && !outer(i, j + 1));
    px(i, j, edge ? OUT : (j <= 1 ? BAND[0] : BAND[1]));
  }
  
  // 音符のアホ毛（バンドの上にぴょこん）
  for (let j = 0; j <= 2; j++) px(18, j, '#ff6f91');
  px(19, 0, '#ff6f91'); px(20, 1, '#ff6f91'); px(17, 2, '#ff6f91'); px(17, 3, '#e0507a'); px(18, 3, '#e0507a');
  // イヤーカップ
  for (const cx of [3.4, 28.6]) {
    const cup = ell(cx, 13.2, 3.5, 5.3);
    shade(cup, PINK, cx - 1, 11, 3.5, 5.3);
    const padX = cx < 16 ? 6 : 25;
    for (let j = 9; j <= 17; j++) if (cup(padX, j) && !cup(padX + (cx < 16 ? 1 : -1), j) === false) px(padX, j, '#8a3a62');
    px(Math.round(cx) - 1, 10, W); px(Math.round(cx) - 1, 11, PINK[0]);
  }
  // ほっぺ
  for (const ox of [5, 23]) { rect(ox, 17, 4, 2, '#ff9eb0'); px(ox, 17, '#ffc4d0'); }
  // 顔
  const MOUTH = '#c2414f', TONGUE = '#ff8fa3', SHINE = '#5d4c8c';
  const eyes = (o = 0) => {
    for (const ex of [9, 20]) { rect(ex, 12 + o, 3, 4, OUT); px(ex, 12 + o, W); px(ex + 1, 12 + o, W); px(ex + 2, 14 + o, SHINE); px(ex + 1, 15 + o, '#5a4a8a'); }
  };
  switch (face) {
    case 'blink':
      for (const ex of [9, 20]) { px(ex, 14, OUT); px(ex + 1, 15, OUT); px(ex + 2, 14, OUT); }
      px(15, 19, OUT); px(16, 19, OUT); break;
    case 'sleep':
      for (const ex of [9, 20]) rect(ex, 15, 3, 1, OUT);
      px(15, 19, OUT); px(16, 19, OUT); break;
    case 'happy':
      for (const ex of [9, 20]) { px(ex, 15, OUT); px(ex + 1, 14, OUT); px(ex + 2, 15, OUT); px(ex + 1, 13, OUT); }
      rect(14, 18, 4, 1, OUT); rect(14, 19, 4, 1, MOUTH); rect(15, 20, 2, 1, TONGUE);
      px(13, 18, OUT); px(18, 18, OUT); px(13, 19, OUT); px(18, 19, OUT); px(14, 20, OUT); px(17, 20, OUT); rect(15, 21, 2, 1, OUT); break;
    case 'high':
      for (const ex of [9, 20]) { rect(ex, 11, 3, 5, OUT); px(ex, 11, W); px(ex + 1, 11, W); px(ex, 12, W); px(ex + 2, 14, SHINE); }
      rect(15, 18, 2, 1, OUT); rect(15, 19, 2, 2, MOUTH); px(14, 19, OUT); px(17, 19, OUT); px(14, 20, OUT); px(17, 20, OUT); rect(15, 21, 2, 1, OUT); break;
    case 'low':
      eyes(1);
      px(9, 11, OUT); px(10, 11, OUT); px(11, 10, OUT); px(20, 10, OUT); px(21, 11, OUT); px(22, 11, OUT);
      px(13, 20, OUT); px(14, 19, OUT); px(15, 20, OUT); px(16, 19, OUT); px(17, 20, OUT); px(18, 19, OUT); break;
    case 'sing':
      eyes();
      rect(15, 18, 2, 1, OUT); rect(14, 19, 4, 1, MOUTH); rect(15, 20, 2, 1, TONGUE);
      px(13, 19, OUT); px(18, 19, OUT); px(14, 20, OUT); px(17, 20, OUT); rect(15, 21, 2, 1, OUT); break;
    default:
      eyes(); px(14, 19, OUT); px(15, 20, OUT); px(16, 20, OUT); px(17, 19, OUT);
  }
  SPR_CACHE[key] = cv2;
  return cv2;
}

// タイトル画面のキャラ
$('coverChara').getContext('2d').drawImage(makeSprite32('happy', false), 0, 0);

// ===== 状態 =====
let ac = null, analyser = null, buf = null, yinBuf = null;
let mode = 'off';
let notes = [], t0 = 0, endTime = 0, tol = 35;
let combo = 0, bestCombo = 0;
let hist = [], curMidi = null, lastVoicedAt = 0, curRms = 0;
let charY = null, jump = 0, animT = 0, scrollX = 0, lastFrame = 0;
let trail = [], particles = [], popups = [];
let W = 0, H = 0, dpr = 1, P = 3;
let hills1 = [], hills2 = [], stars = [];

// ===== 画面サイズ =====
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = false;
  P = Math.max(2, Math.min(4, Math.round(Math.min(W, H) / 120)));
  // 背景の山と星
  hills1 = []; hills2 = [];
  for (let i = 0; i < 400; i++) {
    hills1.push(Math.round(6 + 4 * Math.sin(i * 0.13) + 2 * Math.sin(i * 0.37)));
    hills2.push(Math.round(10 + 6 * Math.sin(i * 0.07 + 1) + 3 * Math.sin(i * 0.23)));
  }
  stars = [];
  for (let i = 0; i < 40; i++) stars.push({ x: Math.random(), y: Math.random() * 0.5, tw: Math.random() * 6 });
}
window.addEventListener('resize', resize);

// ===== マイク開始 =====
$('micBtn').onclick = async () => {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    await ac.resume();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);
    buf = new Float32Array(analyser.fftSize);
    yinBuf = new Float32Array(analyser.fftSize / 2);
    $('startCover').style.display = 'none';
    $('go').disabled = false;
    mode = 'free';
    resize();

// ===== 音程検出（YIN法） =====
function detectPitch() {
  analyser.getFloatTimeDomainData(buf);
  const N = buf.length, sr = ac.sampleRate;
  let rms = 0;
  for (let i = 0; i < N; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / N);
  curRms = rms;
  // 雑音レベルの学習（声が出ていないときの音量を、ゆっくり追いかける）
  // 静かになったらすぐ下げ、上げるのは数十秒かけてゆっくり（歌い続けても声を雑音と勘違いしない）
  if (rms < noiseFloor) noiseFloor = noiseFloor * 0.9 + rms * 0.1;
  else noiseFloor = Math.min(0.01, noiseFloor * 0.9995 + rms * 0.0005);
  gateNow = Math.max(GATE_MIN[$('sens').value] || 0.004, noiseFloor * 2.5);
  if (rms < gateNow) return null;
  const Wn = N / 2;
  const tMax = Math.min(Wn - 2, Math.floor(sr / 75));    // 人の声の範囲（約75〜1000Hz）だけを見る
  const tMin = Math.floor(sr / 1000);
  const d = yinBuf;
  d[0] = 1;
  let running = 0;
  for (let tau = 1; tau <= tMax; tau++) {
    let sum = 0;
    for (let i = 0; i < Wn; i++) { const df = buf[i] - buf[i + tau]; sum += df * df; }
    running += sum;
    d[tau] = running ? sum * tau / running : 1;
  }
  let tau = -1;
  for (let t = tMin; t <= tMax; t++) {
    if (d[t] < 0.3) { while (t + 1 <= tMax && d[t + 1] < d[t]) t++; tau = t; break; }
  }
  if (tau < 0) return null;                                // 息まじりの声も拾えるよう基準はゆるめ（雑音は下の「続いているか」で除外）
  const x0 = d[tau - 1], x1 = d[tau], x2 = tau + 1 <= tMax ? d[tau + 1] : x1;
  const den = x0 + x2 - 2 * x1;
  const better = den ? tau + (x0 - x2) / (2 * den) : tau;
  return 69 + 12 * Math.log2(sr / better / 440);
}
function smoothMidi(m) {
  hist.push(m);
  if (hist.length > 7) hist.shift();
  const v = hist.filter(x => x !== null);
  if (v.length < 4) return null;                            // 一瞬の音ではなく、続いている声だけ
  const s = [...v].sort((a, b) => a - b);
  let med = s[Math.floor(s.length / 2)];
  const steady = v.filter(x => Math.abs(x - med) < 1 || Math.abs(Math.abs(x - med) - 12) < 1).length;
  if (steady < 3) return null;                              // 高さがバラバラな音（物音・息）は無視
  if (curMidi !== null) {
    const diff = med - curMidi;
    if (Math.abs(Math.abs(diff) - 12) < 0.6) med -= 12 * Math.sign(diff);
  }
  return med;
}

// ===== 練習の組み立て =====
function buildExercise() {
  const ex = EXERCISES[exSel.value];
  const base = parseInt($('voice').value, 10) + keyShift;
  tol = parseInt($('level').value, 10);
  notes = [];
  let t = 4 * BEAT;                       // 1小節のカウントイン
  for (const step of ex.seq) {
    notes.push({ m: base + step, step, start: t, dur: ex.dur * BEAT, samples: [], done: false, ratio: 0 });
    t += ex.dur * BEAT + GAP;
  }
  endTime = t - GAP + 0.6;
}
function playGuide(m, when) {
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = 'square';                       // ファミコンっぽい矩形波
  osc.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(0.1, when + 0.02);
  g.gain.setValueAtTime(0.1, when + GUIDE_LEN - 0.1);
  g.gain.linearRampToValueAtTime(0, when + GUIDE_LEN);
  osc.connect(g).connect(ac.destination);
  osc.start(when); osc.stop(when + GUIDE_LEN + 0.05);
}
function blip(freq, len = 0.08, vol = 0.05) {      // 効果音
  if (!ac) return;
  const now = ac.currentTime;
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(freq, now);
  osc.frequency.linearRampToValueAtTime(freq * 1.5, now + len);
  g.gain.setValueAtTime(vol, now);
  g.gain.linearRampToValueAtTime(0, now + len);
  osc.connect(g).connect(ac.destination);
  osc.start(now); osc.stop(now + len + 0.02);
}


// ===== ファミコン風の音源：ドラム（ノイズ）＋伴奏（三角波ベース・矩形波アルペジオ） =====
let noiseBuf = null, pulse25 = null, musicNodes = [], musicOut = null;
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
function initSynth() {
  if (noiseBuf) return;
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0);
  let v = 0;
  for (let i = 0; i < d.length; i++) { if (i % 2 === 0) v = Math.random() * 2 - 1; d[i] = v; }   // 粗いノイズ（昔のゲーム機っぽく）
  const n = 32, re = new Float32Array(n), im = new Float32Array(n);
  for (let k = 1; k < n; k++) re[k] = (2 / (k * Math.PI)) * Math.sin(k * Math.PI * 0.25);
  pulse25 = ac.createPeriodicWave(re, im);
}
function stopMusic() {
  for (const nd of musicNodes) { try { nd.stop(); } catch (e) {} }
  musicNodes = [];
  if (musicOut) { try { musicOut.disconnect(); } catch (e) {} musicOut = null; }
}
function env(g, t, vol, len) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + len); }

  const o = ac.createOscillator(), g = ac.createGain();
  if (typeof wave === 'string') o.type = wave; else o.setPeriodicWave(wave);
  o.frequency.setValueAtTime(freq, t);
  env(g, t, vol, len);
  o.connect(g).connect(musicOut); o.start(t); o.stop(t + len + 0.02); musicNodes.push(o);
}
function noiseHit(t, len, vol, type, freq, q = 0.8) {
  const s2 = ac.createBufferSource(); s2.buffer = noiseBuf;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); env(g, t, vol, len);
  s2.connect(f).connect(g).connect(musicOut); s2.start(t, Math.random() * 0.5); s2.stop(t + len + 0.02); musicNodes.push(s2);
}
function kick(t) {
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
  env(g, t, 0.55, 0.16);
  o.connect(g).connect(musicOut); o.start(t); o.stop(t + 0.2); musicNodes.push(o);
}
// 練習の音に合う和音（移動ドの度数 → I・IV・Vのどれか）
const chordRoot = step => ({ 0: 0, 2: 7, 4: 0, 5: 5, 7: 0, 9: 5, 11: 7 })[((step % 12) + 12) % 12] ?? 0;
function scheduleMusic(acT0) {
  stopMusic(); initSynth();
  musicOut = ac.createGain(); musicOut.gain.value = 0.9; musicOut.connect(ac.destination);
  const tonic = tonicMidi(), beats = Math.ceil(endTime / BEAT);
  const useBeat = $('beat').checked, useAcc = $('accomp').checked;
  const chordAt = t => { for (const n of notes) if (t >= n.start - GAP - 1e-6 && t < n.start + n.dur) return chordRoot(n.step); return 0; };
  for (let b = 0; b < beats; b++) {
    const tb = b * BEAT, t = acT0 + tb;
    const countIn = tb < notes[0].start - 1e-6;
    if (useBeat) {
      if (countIn) { noiseHit(t, 0.04, b === 0 ? 0.22 : 0.14, 'highpass', 6000); }
      else {
        if (b % 2 === 0) kick(t); else noiseHit(t, 0.13, 0.22, 'bandpass', 1800);
        noiseHit(t, 0.03, 0.08, 'highpass', 7000); noiseHit(t + BEAT / 2, 0.03, 0.06, 'highpass', 7000);
      }
    }
    if (useAcc && !countIn) {
      const root = chordAt(tb);
      const tri = [0, 4, 7].map(v => tonic + root + v);
      synthTone('triangle', mf(tonic - 12 + root), t, BEAT * 0.45, 0.22);                    // ベース
      const arp = [tri[0], tri[1], tri[2], tri[1]];
      for (let k = 0; k < 2; k++) synthTone(pulse25, mf(arp[(b * 2 + k) % 4] + 12), t + k * BEAT / 2, BEAT * 0.4, 0.035);   // アルペジオ
    }

}

$('go').onclick = () => {
  if (!ac) return;
  ac.resume();
  $('overlay').style.display = 'none';
  buildExercise();
  combo = 0; bestCombo = 0; trail = []; particles = []; popups = [];
  t0 = performance.now() / 1000;
  const acT0 = ac.currentTime;
  if ($('guide').checked) for (const n of notes) playGuide(n.m, acT0 + n.start - GUIDE_LEAD);
  scheduleMusic(acT0);
  mode = 'exercise';
  $('go').disabled = true;
};

// ===== 座標 =====
function groundH() { return P * 9; }
function viewRange() {
  if (mode === 'exercise' || mode === 'result') {
    const ms = notes.map(n => n.m);
    return [Math.min(...ms) - 5, Math.max(...ms) + 5];
  }
  const base = parseInt($('voice').value, 10) + keyShift;
  return [base - 7, base + 19];
}
function yOf(m, lo, hi) {
  const top = 28, bot = H - groundH() - 26;
  return top + (hi - m) / (hi - lo) * (bot - top);
}
const snap = v => Math.round(v / P) * P;
function foldInto(m, lo, hi) { while (m > hi + 0.5) m -= 12; while (m < lo - 0.5) m += 12; return m; }
function foldCents(c) { while (c > 600) c -= 1200; while (c < -600) c += 1200; return c; }
// 移動ド：選んだ声の高さ＋キーを「ド」とする
function tonicMidi() { return parseInt($('voice').value, 10) + keyShift; }
const relOf = m => (((Math.round(m) - tonicMidi()) % 12) + 12) % 12;
const noteName = m => NOTE_NAMES[relOf(m)];
const isWhite = rel => [0,2,4,5,7,9,11].includes(rel);
const KW = () => P * 11;   // 左の鍵盤の幅

// ===== メインループ =====
function loop() {
  requestAnimationFrame(loop);
  const nowAbs = performance.now() / 1000;
  const dt = Math.min(0.05, nowAbs - lastFrame); lastFrame = nowAbs;
  animT += dt;
  // お手本の音が鳴っている間は、マイクが拾ったお手本を声と間違えないよう判定を止める
  const tt = nowAbs - t0;
  const guidePlaying = mode === 'exercise' && $('guide').checked && notes.some(n => tt >= n.start - GUIDE_LEAD - 0.05 && tt < n.start - GUIDE_LEAD + GUIDE_LEN + 0.12);
  const raw = detectPitch();
  const m = smoothMidi(guidePlaying ? null : raw);
  if (m !== null) { curMidi = m; lastVoicedAt = nowAbs; }
  else if (nowAbs - lastVoicedAt > 0.25) curMidi = null;

  const [lo, hi] = viewRange();
  const charX = snap(W * 0.28);
  const t = nowAbs - t0;
  const speed = mode === 'exercise' ? SCROLL_PX : (curMidi !== null ? FREE_SCROLL : 0);
  scrollX += speed * dt;

  // --- 判定 ---
  let active = null, dev = null, expr = 'normal';
  if (mode === 'exercise') {
    active = notes.find(n => t >= n.start && t < n.start + n.dur) || null;
    if (active) {
      dev = curMidi !== null ? foldCents((curMidi - active.m) * 100) : null;
      active.samples.push({ t: t - active.start, dev });
      if (dev !== null && Math.abs(dev) <= tol) {
        expr = 'happy';
        if (Math.random() < 0.3) spawnSparkle(charX, charY ?? H / 2);
      } else if (dev !== null) expr = dev < 0 ? 'low' : 'high';
    }
    for (const n of notes) {
      if (!n.done && t >= n.start + n.dur) {
        n.done = true;
        const tot = n.samples.length || 1;
        const hit = n.samples.filter(s => s.dev !== null && Math.abs(s.dev) <= tol).length;
        n.ratio = hit / tot;
        if (n.ratio >= 0.6) {
          combo++; bestCombo = Math.max(bestCombo, combo); jump = 1;
          popups.push({ text: combo >= 3 ? `${combo} COMBO!` : 'NICE!', x: charX, y: (charY ?? H/2) - 40, life: 1, color: '#ffcf5a' });
          blip(660 + combo * 40);
        } else {
          combo = 0;
          popups.push({ text: 'おしい！', x: charX, y: (charY ?? H/2) - 40, life: 1, color: '#ffb0c0' });
          blip(220, 0.12, 0.04);
        }
      }
    }
    if (t > endTime) showResult();
  }
  if (expr === 'normal' && curMidi !== null) expr = 'sing';
  if (curMidi === null && mode !== 'exercise') expr = 'sleep';
  if (expr === 'normal' && (animT % 3.2) < 0.15) expr = 'blink';

  // --- キャラ位置 ---
  let targetY = curMidi !== null ? yOf(foldInto(curMidi, lo, hi), lo, hi) : (charY ?? yOf((lo + hi) / 2, lo, hi));
  charY = charY === null ? targetY : charY + (targetY - charY) * 0.3;
  jump *= 0.85;
  if (curMidi !== null) trail.push({ x: charX - 8 * P, y: charY, ok: expr === 'happy', life: 1 });
  for (const p of trail) { p.x -= speed * dt; p.life -= dt * 0.8; }
  trail = trail.filter(p => p.life > 0 && p.x > -10);

  draw(lo, hi, charX, t, active, expr);

  // --- ヒント ---
  let hint = '';
  if (mode === 'free') hint = curMidi !== null ? `いまの声：${noteName(curMidi)}` : 'ピンクの線が きじゅんの「ド」。声を出すと進むよ';
  else if (mode === 'exercise') {
    if (t < notes[0].start - GUIDE_LEAD) hint = 'READY…';
    else if (active && dev === null) hint = curRms < gateNow ? '声を出して！' : '…';
    else if (active && Math.abs(dev) <= tol) hint = 'ぴったり！';
    else if (active) hint = dev < 0 ? 'ちょっと低い ▲' : 'ちょっと高い ▼';
    else hint = $('guide').checked ? 'お手本を聴いて、雲に合わせてね' : '次の雲に合わせてね';
  }
  $('hint').textContent = hint;
}

// ===== 描画 =====
function draw(lo, hi, charX, t, active, expr) {
  drawBackground();

  // 音の段：基準のドは太いピンクの線、ほかのドレミは点線
  ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  for (let m = Math.ceil(lo); m <= Math.floor(hi); m++) {
    const rel = relOf(m);
    if (!isWhite(rel)) continue;
    const y = snap(yOf(m, lo, hi));
    if (rel === 0) {
      ctx.fillStyle = 'rgba(255,111,145,.25)'; ctx.fillRect(KW(), y - P * 2, W - KW(), P * 5);
      ctx.shadowColor = '#ff6f91'; ctx.shadowBlur = 14; ctx.fillStyle = '#ff8fab'; ctx.fillRect(KW(), y, W - KW(), P); ctx.shadowBlur = 0;
      ctx.font = `${P * 5}px ${FONT}`;
      ctx.fillStyle = INK; ctx.fillText('ド', KW() + P * 3, y - P * 3);
      ctx.fillStyle = '#ffd0dc'; ctx.fillText('ド', KW() + P * 2, y - P * 4);
    } else {
      ctx.fillStyle = 'rgba(255,255,255,.16)';
      for (let x = KW() + P * 2; x < W; x += P * 4) ctx.fillRect(x, y, P, P);
      ctx.font = `${P * 4}px ${FONT}`;
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fillText(NOTE_NAMES[rel], KW() + P * 2, y - P * 3);
    }
  }

  // 雲の足場

    const pxPerCent = Math.abs(yOf(lo, lo, hi) - yOf(lo + 1, lo, hi)) / 100;
    for (const n of notes) {
      const x = snap(charX + (n.start - t) * SCROLL_PX);
      const w = snap(n.dur * SCROLL_PX);
      if (x > W + 20 || x + w < -20) continue;
      const y = yOf(n.m, lo, hi);
      const hh = snap(Math.max(P * 5, tol * 2 * pxPerCent));
      let base = '#c9d6ff', light = '#ffffff', dark = '#7e8bd1';
      if (n.done) {
        if (n.ratio >= 0.6) { base = '#9ff0b8'; light = '#e6ffee'; dark = '#3fa86a'; }
        else { base = '#d6c6d6'; light = '#f2e9f2'; dark = '#8f7a8f'; }
      } else if (n === active) { base = '#ffe08a'; light = '#fff6d0'; dark = '#d19a2a'; }

      drawCloud(x, snap(y - hh / 2), w, hh, base, light, dark);
      ctx.shadowBlur = 0;
      ctx.fillStyle = INK; ctx.font = `${P * 4}px ${FONT}`;
      ctx.fillText(noteName(n.m), x + P * 3, snap(y) + 1);
      const gs = n.start - GUIDE_LEAD;

  if (expr === 'low') { ctx.fillStyle = '#8fd3ff'; ctx.fillRect(sx + 15 * P, sy + 4 * P, P, P * 2); ctx.fillRect(sx + 14 * P, sy + 6 * P, P * 3, P * 2); }
  if (expr === 'high') { ctx.fillStyle = '#ffcf5a'; ctx.fillRect(sx + 16 * P, sy + 1 * P, P, P * 4); ctx.fillRect(sx + 16 * P, sy + 6 * P, P, P); }
  if (expr === 'sleep') { ctx.fillStyle = '#fff'; ctx.fillText('z', sx + 18 * P, sy + 2 * P + Math.sin(animT * 2) * P * 2); ctx.fillText('z', sx + 21 * P, sy - P * 2 + Math.sin(animT * 2 + 1) * P * 2); }

  drawKeyboard(lo, hi, active);

  // マイクの入力レベル（緑＝声として聞こえている、灰色の線＝反応しはじめる大きさ）
  {
    const mw = P * 20, mh = P * 2, mx = W - mw - P * 3, my = mode === 'exercise' ? P * 10 : P * 3;

    const h = Math.max(4, Math.round(n.ratio * 56 / 4) * 4);
    const c = n.ratio >= 0.6 ? '#8ff5b5' : 'rgba(255,255,255,.35)';
    return `<div style="height:${h}px;background:${c};box-shadow:0 0 10px ${c}"><span>${noteName(n.m)}</span></div>`;
  }).join('');

  $('card').innerHTML = `
    <div class="small">こえのすけ の しんだん けっか</div>
    <div class="type">${type}</div>
    <div class="score">${score}<span style="font-size:18px"> てん</span></div>
    <div class="small">さいだいコンボ ${bestCombo} ／ へいきんのずれ ${meanDev >= 0 ? '+' : ''}${Math.round(meanDev)}</div>
    <div class="advice">${advice}</div>
    <div id="bars">${bars}</div>
    <div class="btns">
      <button class="primary" id="again">▶ もういちど</button>
      <button id="free">じゆうに うたう</button>
    </div>`;
  $('overlay').style.display = 'flex';
  blip(523, 0.1); setTimeout(() => blip(659, 0.1), 110); setTimeout(() => blip(784, 0.18), 220);
  $('again').onclick = () => $('go').onclick();
  $('free').onclick = () => { stopMusic(); $('overlay').style.display = 'none'; mode = 'free'; trail = []; };
}

// ===== 小道具 =====
function avg(a) { return a.reduce((x, y) => x + y, 0) / a.length; }
function std(a) { const m = avg(a); return Math.sqrt(avg(a.map(x => (x - m) ** 2))); }
function spawnSparkle(x, y) {
  const cs = ['#ffcf5a', '#ffffff', '#9ff0b8', '#ff9eb0'];
  particles.push({ x: x + (Math.random() - .5) * 30, y: y - 10, vx: (Math.random() - .5) * 2.4, vy: -Math.random() * 2.2 - 0.6,
    life: 1, c: cs[Math.floor(Math.random() * cs.length)] });
}

resize();
})();
</script>
