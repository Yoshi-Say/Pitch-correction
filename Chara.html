<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>こえのすけ - 声で動く音程トレーナー（試作）</title>
<style>
  :root{
    --bg1:#1b2140; --bg2:#2b3466; --panel:rgba(255,255,255,.08);
    --text:#f4f6ff; --sub:#b9c0e6; --accent:#ffd36b; --good:#5ee39a; --bad:#ff8a7a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg1);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
  #wrap{position:fixed;inset:0;display:flex;flex-direction:column}
  header{padding:8px 10px 6px;background:var(--panel);backdrop-filter:blur(6px)}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .row+.row{margin-top:6px}
  h1{font-size:15px;margin:0 6px 0 0;letter-spacing:.05em}
  select,button{font-size:14px;border-radius:10px;border:none;padding:7px 10px;
    background:#3a4480;color:var(--text)}
  button.primary{background:var(--accent);color:#2a2200;font-weight:700}
  button:disabled{opacity:.4}
  label.tg{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:4px}
  .key{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--sub)}
  .key button{padding:4px 9px}
  #stage{flex:1;position:relative}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  #hint{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:14px;color:var(--sub);
    pointer-events:none;text-shadow:0 1px 3px #000}
  #overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(10,12,30,.72);padding:16px}
  #card{background:#fff;color:#222;border-radius:18px;width:min(420px,100%);padding:18px 18px 14px;
    box-shadow:0 10px 40px rgba(0,0,0,.4);text-align:center}
  #card .small{font-size:12px;color:#777}
  #card .type{font-size:26px;font-weight:800;margin:4px 0 2px}
  #card .score{font-size:44px;font-weight:800;color:#3a4480;line-height:1.1}
  #card .advice{font-size:14px;margin:8px 0 10px;line-height:1.6;text-align:left;background:#f3f5ff;
    border-radius:10px;padding:8px 10px}
  #bars{display:flex;gap:4px;align-items:flex-end;height:60px;margin:6px 0 4px}
  #bars div{flex:1;border-radius:4px 4px 0 0;position:relative}
  #bars span{position:absolute;bottom:-16px;left:0;right:0;font-size:10px;color:#666}
  #card .btns{display:flex;gap:8px;justify-content:center;margin-top:22px}
  #card button{background:#3a4480;color:#fff}
  #card button.primary{background:var(--accent);color:#2a2200}
  #startCover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:14px;text-align:center;padding:20px;background:linear-gradient(var(--bg1),var(--bg2))}
  #startCover p{color:var(--sub);font-size:14px;line-height:1.7;margin:0}
  #startCover button{font-size:18px;padding:12px 26px}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <div class="row">
      <h1>こえのすけ</h1>
      <select id="voice">
        <option value="48">低い声（男性）</option>
        <option value="57">中くらい</option>
        <option value="60">高い声（女性）</option>
      </select>
      <select id="ex"></select>
    </div>
    <div class="row">
      <select id="level">
        <option value="50">やさしい</option>
        <option value="35" selected>ふつう</option>
        <option value="20">きびしい</option>
      </select>
      <div class="key">キー<button id="kDown">−</button><span id="kVal">0</span><button id="kUp">＋</button></div>
      <label class="tg"><input type="checkbox" id="guide" checked>お手本の音</label>
      <button id="go" class="primary" disabled>練習スタート</button>
    </div>
  </header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="hint"></div>
    <div id="overlay"><div id="card"></div></div>
    <div id="startCover">
      <div style="font-size:44px">🎤</div>
      <div style="font-size:20px;font-weight:700">声でキャラを動かそう</div>
      <p>声が高いとキャラが上へ、低いと下へ動きます。<br>流れてくる足場にキャラを乗せ続けてね。<br><span style="font-size:12px">※イヤホン推奨（スピーカーだとお手本の音を拾うことがあります）</span></p>
      <button id="micBtn" class="primary">マイクをONにする</button>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// ===== 設定 =====
const NOTE_NAMES = ['ド','ド#','レ','レ#','ミ','ファ','ファ#','ソ','ソ#','ラ','ラ#','シ'];
const EXERCISES = {
  scale: { name: 'ドレミ 上がって下がる', seq: [0,2,4,5,7,5,4,2,0], dur: 1.4 },
  jump:  { name: 'とびとび（ド・ミ・ソ）', seq: [0,4,7,4,0,7,0],     dur: 1.4 },
  high:  { name: '高音チャレンジ',         seq: [0,4,7,12,11,7,4,0], dur: 1.4 },
  long:  { name: 'ロングトーン',           seq: [0,7,4,0],           dur: 2.6 },
};
const GUIDE_LEAD = 1.0;   // 足場が来る何秒前にお手本を鳴らすか
const GUIDE_LEN  = 0.6;
const GAP        = 1.2;   // 足場と足場の間隔
const GATE_RMS   = 0.006; // これ以下は無音扱い
const SCROLL_PX  = 150;   // 1秒あたりの移動量(CSS px)

// ===== 要素 =====
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const exSel = $('ex');
for (const [k, v] of Object.entries(EXERCISES)) {
  const o = document.createElement('option'); o.value = k; o.textContent = v.name; exSel.appendChild(o);
}
let keyShift = 0;
$('kDown').onclick = () => { keyShift = Math.max(-6, keyShift - 1); $('kVal').textContent = keyShift; };
$('kUp').onclick   = () => { keyShift = Math.min( 6, keyShift + 1); $('kVal').textContent = keyShift; };

// ===== 状態 =====
let ac = null, analyser = null, buf = null, yinBuf = null;
let mode = 'off';           // off | free | exercise | result
let notes = [], t0 = 0, endTime = 0, tol = 35;
let combo = 0, bestCombo = 0;
let hist = [];              // 平滑化用
let curMidi = null, lastVoicedAt = 0, curRms = 0;
let charY = null, squash = 0, blinkT = 0;
let trail = [], particles = [], popups = [];
let W = 0, H = 0, dpr = 1;

// ===== 画面サイズ =====
function resize() {
  const r = cv.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = r.width; H = r.height;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);

// ===== マイク開始 =====
$('micBtn').onclick = async () => {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    await ac.resume();
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
    });
    const src = ac.createMediaStreamSource(stream);
    analyser = ac.createAnalyser();
    analyser.fftSize = 2048;
    src.connect(analyser);              // スピーカーには繋がない（ハウリング防止）
    buf = new Float32Array(analyser.fftSize);
    yinBuf = new Float32Array(analyser.fftSize / 2);
    $('startCover').style.display = 'none';
    $('go').disabled = false;
    mode = 'free';
    resize();
    requestAnimationFrame(loop);
  } catch (e) {
    alert('マイクを使えませんでした。ブラウザの設定でマイクを許可してください。\n' + e.message);
  }
};

// ===== 音程検出（YIN法） =====
function detectPitch() {
  analyser.getFloatTimeDomainData(buf);
  const N = buf.length, sr = ac.sampleRate;
  let rms = 0;
  for (let i = 0; i < N; i++) rms += buf[i] * buf[i];
  rms = Math.sqrt(rms / N);
  curRms = rms;
  if (rms < GATE_RMS) return null;

  const Wn = N / 2;
  const tMax = Math.min(Wn - 2, Math.floor(sr / 65));   // 下限 約65Hz
  const tMin = Math.floor(sr / 1100);                   // 上限 約1100Hz
  const d = yinBuf;
  d[0] = 1;
  let running = 0;
  for (let tau = 1; tau <= tMax; tau++) {
    let sum = 0;
    for (let i = 0; i < Wn; i++) { const df = buf[i] - buf[i + tau]; sum += df * df; }
    running += sum;
    d[tau] = running ? sum * tau / running : 1;
  }
  let tau = -1;
  for (let t = tMin; t <= tMax; t++) {
    if (d[t] < 0.12) {
      while (t + 1 <= tMax && d[t + 1] < d[t]) t++;
      tau = t; break;
    }
  }
  if (tau < 0) return null;
  const x0 = d[tau - 1], x1 = d[tau], x2 = tau + 1 <= tMax ? d[tau + 1] : x1;
  const den = x0 + x2 - 2 * x1;
  const better = den ? tau + (x0 - x2) / (2 * den) : tau;
  const f = sr / better;
  return 69 + 12 * Math.log2(f / 440);
}

function smoothMidi(m) {
  hist.push(m);
  if (hist.length > 5) hist.shift();
  const v = hist.filter(x => x !== null);
  if (v.length < 3) return null;
  const s = [...v].sort((a, b) => a - b);
  let med = s[Math.floor(s.length / 2)];
  // 1オクターブ跳ね（誤検出）を抑える
  if (curMidi !== null) {
    const diff = med - curMidi;
    if (Math.abs(Math.abs(diff) - 12) < 0.6) med -= 12 * Math.sign(diff);
  }
  return med;
}

// ===== 練習の組み立て =====
function buildExercise() {
  const ex = EXERCISES[exSel.value];
  const base = parseInt($('voice').value, 10) + keyShift;
  tol = parseInt($('level').value, 10);
  notes = [];
  let t = 2.0;  // 最初の足場までの余裕
  for (const step of ex.seq) {
    notes.push({ m: base + step, start: t, dur: ex.dur, samples: [], done: false, ratio: 0 });
    t += ex.dur + GAP;
  }
  endTime = t - GAP + 0.6;
}

function playGuide(m, when) {
  const osc = ac.createOscillator(), g = ac.createGain();
  osc.type = 'triangle';
  osc.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
  g.gain.setValueAtTime(0, when);
  g.gain.linearRampToValueAtTime(0.25, when + 0.03);
  g.gain.setValueAtTime(0.25, when + GUIDE_LEN - 0.12);
  g.gain.linearRampToValueAtTime(0, when + GUIDE_LEN);
  osc.connect(g).connect(ac.destination);
  osc.start(when); osc.stop(when + GUIDE_LEN + 0.05);
}

$('go').onclick = () => {
  if (!ac) return;
  ac.resume();
  $('overlay').style.display = 'none';
  buildExercise();
  combo = 0; bestCombo = 0; trail = []; particles = []; popups = [];
  t0 = performance.now() / 1000;
  const acT0 = ac.currentTime;
  if ($('guide').checked) {
    for (const n of notes) playGuide(n.m, acT0 + n.start - GUIDE_LEAD);
  }
  mode = 'exercise';
  $('go').disabled = true;
};

// ===== 表示範囲 =====
function viewRange() {
  if (mode === 'exercise' || mode === 'result') {
    const ms = notes.map(n => n.m);
    return [Math.min(...ms) - 5, Math.max(...ms) + 5];
  }
  const base = parseInt($('voice').value, 10) + keyShift;
  return [base - 7, base + 19];
}
function yOf(m, lo, hi) {
  const top = 30, bot = H - 50;
  return top + (hi - m) / (hi - lo) * (bot - top);
}
function foldInto(m, lo, hi) {
  while (m > hi + 0.5) m -= 12;
  while (m < lo - 0.5) m += 12;
  return m;
}
function foldCents(c) {
  while (c > 600) c -= 1200;
  while (c < -600) c += 1200;
  return c;
}
const noteName = m => NOTE_NAMES[((Math.round(m) % 12) + 12) % 12];

// ===== メインループ =====
function loop() {
  requestAnimationFrame(loop);
  const nowAbs = performance.now() / 1000;
  const raw = detectPitch();
  const m = smoothMidi(raw);
  if (m !== null) { curMidi = m; lastVoicedAt = nowAbs; }
  else if (nowAbs - lastVoicedAt > 0.25) curMidi = null;

  const [lo, hi] = viewRange();
  const charX = W * 0.28;
  const t = nowAbs - t0;

  // --- 判定 ---
  let active = null, dev = null, expr = 'idle';
  if (mode === 'exercise') {
    active = notes.find(n => t >= n.start && t < n.start + n.dur) || null;
    if (active) {
      dev = curMidi !== null ? foldCents((curMidi - active.m) * 100) : null;
      active.samples.push({ t: t - active.start, dev });
      if (dev !== null && Math.abs(dev) <= tol) {
        expr = 'happy';
        if (Math.random() < 0.25) spawnSparkle(charX, charY ?? H / 2);
      } else if (dev !== null) {
        expr = dev < 0 ? 'low' : 'high';
      }
    }
    for (const n of notes) {
      if (!n.done && t >= n.start + n.dur) {
        n.done = true;
        const tot = n.samples.length || 1;
        const hit = n.samples.filter(s => s.dev !== null && Math.abs(s.dev) <= tol).length;
        n.ratio = hit / tot;
        if (n.ratio >= 0.6) {
          combo++; bestCombo = Math.max(bestCombo, combo); squash = 1;
          popups.push({ text: combo >= 3 ? `${combo}コンボ！` : 'ナイス！', x: charX, y: (charY ?? H/2) - 50, life: 1, color: '#ffd36b' });
        } else {
          combo = 0;
          popups.push({ text: 'おしい！', x: charX, y: (charY ?? H/2) - 50, life: 1, color: '#ffb0a5' });
        }
      }
    }
    if (t > endTime) showResult();
  }
  if (expr === 'idle' && curMidi !== null) expr = 'sing';
  if (curMidi === null && mode !== 'exercise') expr = 'sleep';

  // --- キャラ位置 ---
  let targetY;
  if (curMidi !== null) targetY = yOf(foldInto(curMidi, lo, hi), lo, hi);
  else targetY = charY ?? yOf((lo + hi) / 2, lo, hi);
  charY = charY === null ? targetY : charY + (targetY - charY) * 0.3;
  if (curMidi !== null) trail.push({ x: charX, y: charY, ok: expr === 'happy' });
  if (trail.length > 90) trail.shift();
  for (const p of trail) p.x -= SCROLL_PX / 60;

  // --- 描画 ---
  draw(lo, hi, charX, t, active, dev, expr);

  // --- ヒント ---
  let hint = '';
  if (mode === 'free') hint = curMidi !== null ? `いまの声：${noteName(curMidi)}` : '声を出すとキャラが動くよ（「あー」でOK）';
  else if (mode === 'exercise') {
    if (t < notes[0].start - GUIDE_LEAD) hint = 'よーい…';
    else if (active && dev === null) hint = curRms < GATE_RMS ? '声を出して！' : '…';
    else if (active && Math.abs(dev) <= tol) hint = 'ぴったり！';
    else if (active) hint = dev < 0 ? 'ちょっと低い ↑' : 'ちょっと高い ↓';
    else hint = $('guide').checked ? 'お手本を聴いて、足場に合わせてね' : '次の足場に合わせてね';
  }
  $('hint').textContent = hint;
}

// ===== 描画 =====
function draw(lo, hi, charX, t, active, dev, expr) {
  // 背景
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#1b2140'); g.addColorStop(1, '#2b3466');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // 音の線
  ctx.font = '11px sans-serif'; ctx.textBaseline = 'middle';
  for (let m = Math.ceil(lo); m <= Math.floor(hi); m++) {
    const y = yOf(m, lo, hi);
    const pc = ((m % 12) + 12) % 12;
    const natural = [0,2,4,5,7,9,11].includes(pc);
    ctx.strokeStyle = pc === 0 ? 'rgba(255,255,255,.22)' : natural ? 'rgba(255,255,255,.08)' : 'rgba(255,255,255,.03)';
    ctx.beginPath(); ctx.moveTo(34, y); ctx.lineTo(W, y); ctx.stroke();
    if (natural) { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.fillText(NOTE_NAMES[pc], 6, y); }
  }

  // 足場
  if (mode === 'exercise' || mode === 'result') {
    const pxPerCent = Math.abs(yOf(lo, lo, hi) - yOf(lo + 1, lo, hi)) / 100;
    for (const n of notes) {
      const x = charX + (n.start - t) * SCROLL_PX;
      const w = n.dur * SCROLL_PX;
      if (x > W + 20 || x + w < -20) continue;
      const y = yOf(n.m, lo, hi);
      const hh = Math.max(10, tol * 2 * pxPerCent);
      let col = 'rgba(140,170,255,.55)';
      if (n.done) col = n.ratio >= 0.6 ? 'rgba(94,227,154,.65)' : 'rgba(255,138,122,.55)';
      else if (n === active) col = 'rgba(255,211,107,.75)';
      roundRect(x, y - hh / 2, w, hh, 7); ctx.fillStyle = col; ctx.fill();
      ctx.fillStyle = 'rgba(20,24,50,.85)'; ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'left'; ctx.fillText(noteName(n.m), x + 6, y);
      // お手本が鳴っている間は♪
      const gs = n.start - GUIDE_LEAD;
      if ($('guide').checked && t >= gs && t < gs + GUIDE_LEN) {
        ctx.fillStyle = '#ffd36b'; ctx.font = '20px sans-serif'; ctx.fillText('♪', x + 4, y - hh / 2 - 14);
      }
    }
  }

  // 軌跡
  for (let i = 0; i < trail.length; i++) {
    const p = trail[i];
    ctx.globalAlpha = i / trail.length * 0.6;
    ctx.fillStyle = p.ok ? '#5ee39a' : '#9fb3ff';
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // パーティクル
  for (const p of particles) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life -= 0.025;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.c; drawStar(p.x, p.y, 4 * p.life + 1);
  }
  ctx.globalAlpha = 1;
  particles = particles.filter(p => p.life > 0);

  // キャラ
  drawChara(charX, charY, expr);

  // ポップアップ
  ctx.textAlign = 'center';
  for (const p of popups) {
    p.y -= 0.6; p.life -= 0.015;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = p.color;
    ctx.fillText(p.text, p.x, p.y);
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  popups = popups.filter(p => p.life > 0);

  // コンボ表示
  if (mode === 'exercise' && combo >= 2) {
    ctx.font = 'bold 16px sans-serif'; ctx.fillStyle = '#ffd36b'; ctx.textAlign = 'right';
    ctx.fillText(`${combo} COMBO`, W - 12, 18); ctx.textAlign = 'left';
  }
}

function drawChara(x, y, expr) {
  if (y === null) return;
  blinkT += 1 / 60;
  squash *= 0.88;
  const r = 24;
  const sx = 1 + squash * 0.25, sy = 1 - squash * 0.2;
  const bob = expr === 'sleep' ? Math.sin(blinkT * 2) * 2 : 0;
  ctx.save();
  ctx.translate(x, y + bob);
  ctx.scale(sx, sy);

  const colors = { happy: '#5ee39a', low: '#7fb0ff', high: '#ffb36b', sing: '#a9b8ff', idle: '#a9b8ff', sleep: '#8a93c0' };
  const body = colors[expr] || '#a9b8ff';
  // 影っぽい輪郭
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(2, 4, r, r * 0.95, 0, 0, Math.PI * 2); ctx.fill();
  // 体
  const gr = ctx.createRadialGradient(-8, -10, 4, 0, 0, r);
  gr.addColorStop(0, '#ffffff'); gr.addColorStop(0.25, body); gr.addColorStop(1, shade(body));
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.ellipse(0, 0, r, r * 0.95, 0, 0, Math.PI * 2); ctx.fill();
  // 頭の音符しっぽ
  ctx.strokeStyle = shade(body); ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(8, -r * 0.85); ctx.quadraticCurveTo(14, -r * 1.5, 22, -r * 1.25); ctx.stroke();

  // 目
  ctx.fillStyle = '#1d2140';
  const blink = (blinkT % 3.2) < 0.12;
  if (expr === 'sleep' || blink) {
    ctx.lineWidth = 2; ctx.strokeStyle = '#1d2140';
    line(-11, -4, -5, -4); line(5, -4, 11, -4);
  } else if (expr === 'happy') {
    ctx.lineWidth = 2.5; ctx.strokeStyle = '#1d2140';
    ctx.beginPath(); ctx.arc(-8, -2, 4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(8, -2, 4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
  } else {
    const eyeH = expr === 'high' ? 5.5 : 4.5;
    ctx.beginPath(); ctx.ellipse(-8, -4, 3.2, eyeH, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(8, -4, 3.2, eyeH, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-7, -6, 1.2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, -6, 1.2, 0, Math.PI * 2); ctx.fill();
  }
  // ほっぺ
  ctx.fillStyle = 'rgba(255,120,140,.45)';
  ctx.beginPath(); ctx.ellipse(-14, 5, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(14, 5, 4, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  // 口
  ctx.strokeStyle = '#1d2140'; ctx.fillStyle = '#5a1f2a'; ctx.lineWidth = 2;
  if (expr === 'happy') {
    ctx.beginPath(); ctx.arc(0, 5, 6, 0, Math.PI); ctx.fill();
  } else if (expr === 'high') {
    ctx.beginPath(); ctx.ellipse(0, 9, 3.5, 4.5, 0, 0, Math.PI * 2); ctx.fill();
  } else if (expr === 'low') {
    ctx.beginPath(); ctx.moveTo(-6, 10); ctx.quadraticCurveTo(-3, 7, 0, 10); ctx.quadraticCurveTo(3, 13, 6, 10); ctx.stroke();
  } else if (expr === 'sing') {
    ctx.beginPath(); ctx.ellipse(0, 9, 4, 3, 0, 0, Math.PI * 2); ctx.fill();
  } else if (expr === 'sleep') {
    line(-3, 9, 3, 9);
  } else {
    ctx.beginPath(); ctx.arc(0, 6, 4, 0.2, Math.PI - 0.2); ctx.stroke();
  }
  ctx.restore();

  // 汗（低いとき）/ びっくり（高いとき）/ zzz（寝てる）
  ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
  if (expr === 'low') { ctx.fillStyle = '#9fd4ff'; ctx.fillText('💧', x + r + 4, y - r + 2); }
  if (expr === 'high') { ctx.fillStyle = '#ffd36b'; ctx.fillText('!', x + r + 2, y - r); }
  if (expr === 'sleep') { ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillText('z z', x + r + 10, y - r - 4 + Math.sin(blinkT * 2) * 3); }
  ctx.textAlign = 'left';
}

// ===== 結果 =====
function showResult() {
  mode = 'result';
  $('go').disabled = false;
  const ratios = notes.map(n => n.ratio);
  const score = Math.round(ratios.reduce((a, b) => a + b, 0) / ratios.length * 100);

  const voiced = notes.flatMap(n => n.samples.filter(s => s.dev !== null).map(s => Math.max(-300, Math.min(300, s.dev))));
  const meanDev = voiced.length ? voiced.reduce((a, b) => a + b, 0) / voiced.length : 0;

  let scoopCount = 0, unstableCount = 0, judged = 0;
  for (const n of notes) {
    const early = n.samples.filter(s => s.dev !== null && s.t < 0.3).map(s => s.dev);
    const late  = n.samples.filter(s => s.dev !== null && s.t >= 0.3 * n.dur).map(s => s.dev);
    if (early.length < 3 || late.length < 5) continue;
    judged++;
    const e = avg(early), l = avg(late);
    if (e < -60 && e - l < -50) scoopCount++;
    if (std(late) > 45) unstableCount++;
  }
  const scoop = judged && scoopCount / judged >= 0.4;
  const unstable = judged && unstableCount / judged >= 0.5;

  let type, advice;
  if (voiced.length < 10) {
    type = '声がとどかなかったかも'; advice = 'マイクに声が届いていないようです。もう少し大きめの声か、スマホを口に近づけて試してみてください。';
  } else if (score >= 85) {
    type = 'ぴったり職人'; advice = 'ほぼ完璧です！「きびしい」モードや「高音チャレンジ」に進んでみましょう。';
  } else if (scoop) {
    type = 'しゃくりあげタイプ'; advice = '出だしで下から探りにいく癖があります。声を出す前にお手本の高さを頭の中で鳴らして、「最初から足場の上に着地する」イメージで歌ってみましょう。';
  } else if (meanDev < -25) {
    type = 'ちょい低めタイプ'; advice = '全体的に少し低めです。お手本より「ほんの少し上」を狙うくらいの意識で、ちょうど良くなることが多いです。';
  } else if (meanDev > 25) {
    type = 'ちょい高めタイプ'; advice = '全体的に少し高めです。力みで上ずっているかも。肩の力を抜いて、楽な声で合わせてみましょう。';
  } else if (unstable) {
    type = 'ふらふらタイプ'; advice = '高さは合っているのに、伸ばしている間に揺れています。「ロングトーン」で、まっすぐ伸ばす練習がおすすめです。';
  } else {
    type = 'のびしろタイプ'; advice = '外れ方に大きな癖はありません。お手本をよく聴いてから歌うのを意識すると、すぐスコアが伸びるはずです。';
  }

  const bars = notes.map(n => {
    const h = Math.max(4, n.ratio * 60);
    const c = n.ratio >= 0.6 ? '#5ee39a' : '#ff8a7a';
    return `<div style="height:${h}px;background:${c}"><span>${noteName(n.m)}</span></div>`;
  }).join('');

  $('card').innerHTML = `
    <div class="small">今回のあなたは…</div>
    <div class="type">${type}</div>
    <div class="score">${score}<span style="font-size:18px">点</span></div>
    <div class="small">最大コンボ ${bestCombo} ／ 平均のずれ ${meanDev >= 0 ? '+' : ''}${Math.round(meanDev)}</div>
    <div class="advice">${advice}</div>
    <div id="bars">${bars}</div>
    <div class="btns">
      <button class="primary" id="again">もう一回</button>
      <button id="free">自由に歌う</button>
    </div>`;
  $('overlay').style.display = 'flex';
  $('again').onclick = () => $('go').onclick();
  $('free').onclick = () => { $('overlay').style.display = 'none'; mode = 'free'; trail = []; };
}

// ===== 小道具 =====
function avg(a) { return a.reduce((x, y) => x + y, 0) / a.length; }
function std(a) { const m = avg(a); return Math.sqrt(avg(a.map(x => (x - m) ** 2))); }
function line(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function roundRect(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function drawStar(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = Math.PI / 5 * i - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr);
  }
  ctx.closePath(); ctx.fill();
}
function spawnSparkle(x, y) {
  const cs = ['#ffd36b', '#ffffff', '#5ee39a', '#ffb0f0'];
  particles.push({ x: x + (Math.random() - .5) * 30, y: y - 10, vx: (Math.random() - .5) * 2.2, vy: -Math.random() * 2 - 0.5,
    life: 1, c: cs[Math.floor(Math.random() * cs.length)] });
}
function shade(hex) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.round(((n >> 16) & 255) * 0.65), g = Math.round(((n >> 8) & 255) * 0.65), b = Math.round((n & 255) * 0.65);
  return `rgb(${r},${g},${b})`;
}

resize();
})();
</script>
