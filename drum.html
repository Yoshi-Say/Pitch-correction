<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#111418">
<title>ドラム リズムトレーナー</title>
<style>
:root{--bg:#111418;--card:#1b2026;--fg:#e8eaed;--sub:#9aa3ad;--acc:#4fc3f7;--ok:#66bb6a;--warn:#ffb74d;--bad:#ef5350}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.55}
.page{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 14px) calc(env(safe-area-inset-bottom) + 28px) calc(env(safe-area-inset-left) + 14px)}
h1{font-size:21px;margin:6px 0 4px} h3{font-size:15px;margin:14px 0 4px} p{margin:6px 0}
.card{background:var(--card);border-radius:12px;padding:14px;margin:10px 0}
button{font:inherit;color:var(--fg);background:#2a313a;border:0;border-radius:10px;padding:12px 14px;width:100%;margin:5px 0;touch-action:manipulation;cursor:pointer}
button.primary{background:var(--acc);color:#04222e;font-weight:700}
.lv{display:flex;justify-content:space-between;align-items:center;text-align:left;gap:8px;border:2px solid transparent}
.lv.sel{border-color:var(--acc)} .lv span{color:var(--sub);font-size:12.5px;text-align:right;white-space:nowrap}
.sub{color:var(--sub);font-size:13px}
.row{display:flex;gap:8px}.row>*{flex:1}
.warn{color:var(--warn)}.ok{color:var(--ok)}.bad{color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px} td{padding:5px 3px;border-bottom:1px solid #2a313a}
select,input[type=number]{width:100%;font:inherit;padding:9px;background:#2a313a;color:var(--fg);border:0;border-radius:8px}
label{display:block;margin:8px 0 3px;font-size:13px;color:var(--sub)}
.big{font-size:44px;font-weight:700;text-align:center;line-height:1.2}
canvas.g{width:100%;height:140px;background:#0b0e11;border-radius:10px;display:block;margin:6px 0}
ul{margin:4px 0;padding-left:20px} li{margin:3px 0}
#game{position:fixed;inset:0;display:none;flex-direction:column;background:#0b0e11;touch-action:none;user-select:none;-webkit-user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#bar{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:13px;color:var(--sub)}
#bar b{color:var(--fg)} #quit{width:auto;margin:0;padding:6px 12px;font-size:13px}
#hw{flex:1;min-height:0;width:100%;display:block}
#pads{position:relative;height:min(44vh,340px);border-top:1px solid #2a313a;background:radial-gradient(ellipse at 50% 55%,#3a2a1e 0%,#241a13 55%,#120d0a 100%)}
.pad{position:absolute;border-radius:50%;transform:translate(-50%,-50%);touch-action:none;transition:transform .05s}
.pad svg{display:block;pointer-events:none}
.pad .pl{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);font-size:9.5px;font-weight:700;white-space:nowrap;padding:0 5px;border-radius:7px;background:rgba(0,0,0,.6);pointer-events:none}
.pad.hit{transform:translate(-50%,-50%) scale(.95)} .pad.hit svg{filter:brightness(1.35)}
.pad.off{opacity:.3}
.tap{height:180px;border-radius:16px;background:#263040;display:flex;align-items:center;justify-content:center;font-size:20px;user-select:none;-webkit-user-select:none;touch-action:none;margin:10px 0}
.tap.flash{background:#3d5a80}
a.hub{color:var(--acc);text-decoration:none;font-size:14px}
</style>
</head>
<body>
<div class="page" id="menu"></div>
<div id="game">
  <div id="bar"><b id="gname"></b><span id="gstat" style="flex:1;text-align:right"></span><button id="quit">やめる</button></div>
  <canvas id="hw"></canvas>
  <div id="pads"></div>
</div>
<script>
"use strict";
const $=s=>document.querySelector(s);
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const std=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(mean(a.map(x=>(x-m)**2)))};
const median=a=>{if(!a.length)return 0;const b=[...a].sort((x,y)=>x-y),k=b.length>>1;return b.length%2?b[k]:(b[k-1]+b[k])/2};
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const sgn=v=>(v>0?'+':'')+Math.round(v);

/* ===== 楽器 ===== */
const LANES=['CR','HH','SN','HT','BD','LT','FT','RD'];
const INFO={
  CR:{n:'クラッシュ',c:'#f06292',x:15,y:18,d:24},HH:{n:'ハイハット',c:'#ffd54f',x:13,y:55,d:22},
  SN:{n:'スネア',c:'#ef5350',x:38,y:53,d:24},HT:{n:'ハイタム',c:'#4db6ac',x:40,y:16,d:22},
  BD:{n:'バスドラム',c:'#b39ddb',x:58,y:79,d:30},LT:{n:'ロータム',c:'#4fc3f7',x:62,y:16,d:22},
  FT:{n:'フロアタム',c:'#81c784',x:84,y:58,d:24},RD:{n:'ライド',c:'#ffb74d',x:86,y:20,d:24}};

/* ===== 設定・記録 ===== */
const KEY='drumTrainer.v1';
let DB=(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return {}}})();
DB.set=Object.assign({level:0,tempo:100,bars:8,judge:'normal',speed:1,click:true,off:null,snd:'tap'},DB.set||{});
DB.best=DB.best||{};DB.hist=DB.hist||[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(DB))}catch(e){}};
const WIN={easy:[40,75,120],normal:[25,50,90],hard:[15,30,60]};

/* ===== 音（合成） ===== */
let ctx=null,master=null;const BUF={};
function biquad(x,type,f,q,sr){
  const w=2*Math.PI*f/sr,c=Math.cos(w),al=Math.sin(w)/(2*q);let b0,b1,b2;
  if(type==='hp'){b0=(1+c)/2;b1=-(1+c);b2=b0}else if(type==='lp'){b0=(1-c)/2;b1=1-c;b2=b0}else{b0=al;b1=0;b2=-al}
  const a0=1+al,a1=-2*c,a2=1-al;let x1=0,x2=0,y1=0,y2=0;
  for(let i=0;i<x.length;i++){const y=(b0*x[i]+b1*x1+b2*x2-a1*y1-a2*y2)/a0;x2=x1;x1=x[i];y2=y1;y1=y;x[i]=y}
  return x;
}
function norm(x,g){let m=0;for(const v of x)if(Math.abs(v)>m)m=Math.abs(v);for(let i=0;i<x.length;i++)x[i]=x[i]/m*g;return x}
function synth(sr){
  const A=(sec)=>new Float32Array(Math.floor(sec*sr)),TAU=2*Math.PI;
  let seed=12345;const rnd=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/2147483648-1};
  const sat=(x,d)=>{for(let i=0;i<x.length;i++)x[i]=Math.tanh(x[i]*d);return x};
  // 金物：たくさんの不協和な倍音を重ね、高い倍音ほど早く消える
  const cym=(sec,n,f0,f1,dec,tilt,noise,nDec)=>{const x=A(sec),nz=A(sec);
    for(let p=0;p<n;p++){const f=f0*Math.pow(f1/f0,(p+0.5*(rnd()+1))/n),a=Math.pow(f0/f,tilt)*(0.6+0.4*rnd()),d=dec*Math.pow(f0/f,0.55)*(0.8+0.3*rnd()),ph=rnd()*3,w=TAU*f/sr,len=Math.min(x.length,Math.floor(d*7*sr));
      for(let i=0;i<len;i++)x[i]+=a*Math.sin(w*i+ph)*Math.exp(-i/(d*sr))}
    for(let i=0;i<nz.length;i++)nz[i]=rnd()*Math.exp(-i/(nDec*sr));
    biquad(nz,'hp',5000,0.7,sr);let m=0;for(const v of x)if(Math.abs(v)>m)m=Math.abs(v);
    for(let i=0;i<x.length;i++)x[i]=x[i]/m+nz[i]*noise;return x};
  const drum=(sec,f,bend,bt,dec,o2,o2d,nz,nzf)=>{const x=A(sec),n=A(sec);let ph=0,ph2=0;
    for(let i=0;i<x.length;i++){const t=i/sr,ff=f*(1+bend*Math.exp(-t/bt));ph+=TAU*ff/sr;ph2+=TAU*ff*1.59/sr;
      x[i]=Math.sin(ph)*Math.exp(-t/dec)+o2*Math.sin(ph2)*Math.exp(-t/o2d);n[i]=rnd()*Math.exp(-t/0.012)}
    biquad(n,'lp',nzf,0.7,sr);for(let i=0;i<x.length;i++)x[i]+=n[i]*nz;return x};
  const out={};
  out.BD=norm(sat(drum(0.6,48,1.9,0.016,0.2,0.0,0.05,0.9,3500),1.6),0.95);
  { const x=drum(0.35,190,0.25,0.02,0.07,0.55,0.05,0.4,6000),w=A(0.35);
    for(let i=0;i<w.length;i++){const t=i/sr;w[i]=rnd()*(0.75*Math.exp(-t/0.055)+0.25*Math.exp(-t/0.14))}
    biquad(biquad(w,'hp',1700,0.7,sr),'lp',9500,0.7,sr);for(let i=0;i<x.length;i++)x[i]=x[i]*0.75+w[i]*1.5;out.SN=norm(sat(x,1.3),0.85)}
  out.HH=norm(biquad(cym(0.16,34,3200,14000,0.022,0.25,0.9,0.02),'hp',6000,0.8,sr),0.42);
  out.CR=norm(biquad(cym(2.2,70,340,13000,0.75,0.35,0.9,0.09),'hp',700,0.7,sr),0.62);
  { const x=cym(1.8,50,420,11000,0.6,0.6,0.25,0.02);for(let i=0;i<x.length;i++){const t=i/sr;x[i]+=0.5*Math.sin(TAU*2950*t)*Math.exp(-t/0.25)+0.35*Math.sin(TAU*4410*t)*Math.exp(-t/0.12)}
    out.RD=norm(biquad(x,'hp',900,0.7,sr),0.5)}
  out.HT=norm(sat(drum(0.55,205,0.35,0.025,0.19,0.3,0.06,0.5,4500),1.2),0.82);
  out.LT=norm(sat(drum(0.65,152,0.35,0.028,0.24,0.3,0.07,0.5,4000),1.2),0.84);
  out.FT=norm(sat(drum(0.85,104,0.4,0.03,0.33,0.3,0.08,0.5,3500),1.2),0.88);
  const ck=(f)=>{const x=A(0.04);for(let i=0;i<x.length;i++){const t=i/sr;x[i]=Math.sin(TAU*f*t)*Math.exp(-t/0.008)}return norm(x,0.5)};
  out.CK1=ck(1900);out.CK2=ck(1300);
  return out;
}
async function initAudio(){
  if(!ctx){
    try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
    ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
    master=ctx.createGain();master.gain.value=0.9;master.connect(ctx.destination);
    const raw=synth(ctx.sampleRate);
    for(const k in raw){const b=ctx.createBuffer(1,raw[k].length,ctx.sampleRate);b.getChannelData(0).set(raw[k]);BUF[k]=b}
  }
  if(ctx.state!=='running')try{await ctx.resume()}catch(e){}
}
function play(name,when,vol){
  const s=ctx.createBufferSource();s.buffer=BUF[name];
  if(vol!=null&&vol!==1){const g=ctx.createGain();g.gain.value=vol;s.connect(g).connect(master)}else s.connect(master);
  s.start(when||0);return s;
}
const defaultOff=()=>Math.round(((ctx&&ctx.baseLatency)||0.005)*1000+((ctx&&ctx.outputLatency)||0.015)*1000);

/* ===== 譜面 ===== */
const GV={
  q1:{div:16,SN:'....x.......x...',BD:'x.......x.......'},
  q2:{div:16,HH:'x...x...x...x...',SN:'....x.......x...',BD:'x.......x.......'},
  a:{div:16,HH:'x.x.x.x.x.x.x.x.',SN:'....x.......x...',BD:'x.......x.......'},
  b:{div:16,HH:'x.x.x.x.x.x.x.x.',SN:'....x.......x...',BD:'x.......x.x.....'},
  c:{div:16,HH:'x.x.x.x.x.x.x.x.',SN:'....x.......x...',BD:'x.....x.x.......'},
  d:{div:16,HH:'x.x.x.x.x.x.x.x.',SN:'....x.......x...',BD:'x..x....x.x.....'},
  s16:{div:16,HH:'xxxx.xxxxxxx.xxx',SN:'....x.......x...',BD:'x.......x.x.....'},
  sh:{div:12,HH:'x.xx.xx.xx.x',SN:'...x.....x..',BD:'x.....x.....'}};
const FILL={
  f1:{half:1,SN:'........x.x.x.x.'},
  f2:{half:1,SN:'........x.x.....',HT:'............x...',FT:'..............x.'},
  f3:{half:1,SN:'........xxxx....',HT:'............xx..',FT:'..............xx'},
  f4:{half:0,SN:'xxxx............',HT:'....xxxx........',LT:'........xxxx....',FT:'............xxxx'},
  ft:{half:1,SN:'......xxx...',HT:'.........xx.',FT:'...........x'}};
const LEVELS=[
  {name:'4分 キック＆スネア',bpm:70,g:['q1']},
  {name:'4分 ハイハット付き',bpm:75,g:['q2']},
  {name:'8ビート 基本',bpm:80,g:['a']},
  {name:'8ビート キック変化',bpm:88,g:['a','b','c']},
  {name:'8ビート＋フィル（8分）',bpm:92,g:['a','b','c'],f:['f1','f2'],crash:true},
  {name:'8ビート＋フィル（16分）',bpm:100,g:['b','c'],f:['f2','f3'],crash:true},
  {name:'16分キック＋ライド',bpm:104,g:['d','b'],f:['f3','f4'],crash:true,ride:true},
  {name:'16ビート',bpm:84,g:['s16'],f:['f3'],crash:true},
  {name:'シャッフル（3連）',bpm:96,g:['sh'],f:['ft'],crash:true},
  {name:'総合',bpm:120,g:['b','c','d'],f:['f3','f4'],crash:true,ride:true}];
const pick=a=>a[Math.floor(Math.random()*a.length)];
function buildChart(li,bars,tempoPct){
  const L=LEVELS[li],bpm=Math.round(L.bpm*tempoPct/100),spb=60/bpm,notes=[],used=new Set();
  const add=(lane,beat,pos)=>{notes.push({lane,t:beat*spb,pos,j:null});used.add(lane)};
  const posOf=(st,div)=>div===12?(st%3===0?'on':'tri'):(st%4===0?'on':st%4===2?'off':'six');
  for(let b=0;b<bars;b++){
    const g=GV[pick(L.g)],div=g.div,isFill=L.f&&bars>=4&&b%4===3,fl=isFill?FILL[pick(L.f)]:null;
    const ride=L.ride&&Math.floor(b/4)%2===1,crash=L.crash&&b>0&&b%4===0;
    const put=(lane,str,from,to)=>{for(let st=from;st<to;st++)if(str[st]==='x'){
      let ln=lane;if(ln==='HH'){if(crash&&st===0)ln='CR';else if(ride)ln='RD'}
      add(ln,b*4+st*4/div,posOf(st,div))}};
    const gEnd=fl?(fl.half?div/2:0):div;
    for(const ln of ['HH','SN','BD'])if(g[ln])put(ln,g[ln],0,gEnd);
    if(fl)for(const ln of LANES)if(fl[ln])put(ln,fl[ln],0,div);
  }
  if(L.crash){add('CR',bars*4,'on');add('BD',bars*4,'on')}
  notes.sort((a,b)=>a.t-b.t);
  return {bpm,spb,notes,used,beats:bars*4+(L.crash?1:0)};
}

/* ===== ドラムの見た目 ===== */
function padSVG(ln){
  const u='p'+ln,lug=n=>Array.from({length:n},(_,i)=>`<rect x="46.6" y="0.6" width="6.8" height="7.6" rx="1.6" fill="url(#${u}c)" stroke="#4a4a4a" stroke-width=".5" transform="rotate(${i*360/n} 50 50)"/>`).join('');
  const defs=`<linearGradient id="${u}c" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fafafa"/><stop offset=".35" stop-color="#9a9a9a"/><stop offset=".6" stop-color="#e8e8e8"/><stop offset="1" stop-color="#6e6e6e"/></linearGradient>
    <radialGradient id="${u}h" cx="42%" cy="38%" r="70%"><stop offset="0" stop-color="#fdfcf7"/><stop offset=".7" stop-color="#e6e1d3"/><stop offset="1" stop-color="#bdb6a3"/></radialGradient>
    <radialGradient id="${u}b" cx="38%" cy="32%" r="80%"><stop offset="0" stop-color="#fff4c9"/><stop offset=".3" stop-color="#e6c468"/><stop offset=".75" stop-color="#b48d38"/><stop offset="1" stop-color="#77591b"/></radialGradient>`;
  let body;
  if(ln==='CR'||ln==='RD'||ln==='HH'){
    const bell=ln==='RD'?15:ln==='HH'?9:11,gr=[45,41,37,33,29,25,21].map(r=>`<circle cx="50" cy="50" r="${r}" fill="none" stroke="rgba(60,40,0,.16)" stroke-width=".7"/>`).join('');
    body=`<circle cx="50" cy="52" r="48" fill="rgba(0,0,0,.35)"/><circle cx="50" cy="50" r="48" fill="url(#${u}b)" stroke="#5a4312" stroke-width=".8"/>${gr}
      <path d="M50 50 L14 18 A48 48 0 0 1 40 3 Z" fill="rgba(255,255,255,.30)"/><path d="M50 50 L86 82 A48 48 0 0 1 60 97 Z" fill="rgba(255,255,255,.14)"/>
      <circle cx="50" cy="50" r="${bell}" fill="url(#${u}b)" stroke="rgba(60,40,0,.35)" stroke-width=".8"/>
      ${ln==='HH'?'<circle cx="50" cy="50" r="46.5" fill="none" stroke="rgba(60,40,0,.3)" stroke-width="1.2"/>':''}
      <circle cx="50" cy="50" r="3.4" fill="url(#'+u+'c)" stroke="#333" stroke-width=".6"/>`.replace("'+u+'",u);
  }else if(ln==='BD'){
    body=`<circle cx="50" cy="52" r="48" fill="rgba(0,0,0,.4)"/><circle cx="50" cy="50" r="48" fill="#161616"/><circle cx="50" cy="50" r="46" fill="none" stroke="#8a5a2b" stroke-width="3.2"/>
      <circle cx="50" cy="50" r="43.5" fill="none" stroke="#3a2412" stroke-width=".8"/>${lug(10)}
      <circle cx="50" cy="50" r="40" fill="url(#${u}h)"/><circle cx="50" cy="50" r="40" fill="none" stroke="rgba(0,0,0,.25)" stroke-width=".8"/>
      <circle cx="67" cy="66" r="9" fill="#0d0d0d" stroke="url(#${u}c)" stroke-width="1.6"/><circle cx="50" cy="50" r="7" fill="rgba(0,0,0,.07)"/>`;
  }else{
    const shell={SN:'#8f1d1d',HT:'#143a63',LT:'#143a63',FT:'#143a63'}[ln];
    body=`<circle cx="50" cy="52" r="48" fill="rgba(0,0,0,.4)"/><circle cx="50" cy="50" r="48" fill="${shell}"/><circle cx="50" cy="50" r="45.5" fill="url(#${u}c)"/>${lug(ln==='SN'?10:8)}
      <circle cx="50" cy="50" r="40.5" fill="url(#${u}h)"/><circle cx="50" cy="50" r="40.5" fill="none" stroke="rgba(0,0,0,.28)" stroke-width=".8"/>
      ${ln==='SN'?'<ellipse cx="50" cy="52" rx="15" ry="13" fill="rgba(90,70,40,.10)"/>':'<circle cx="50" cy="50" r="12" fill="rgba(0,0,0,.09)"/>'}
      <path d="M22 30 A36 36 0 0 1 46 13" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="2.4" stroke-linecap="round"/>`;
  }
  return `<svg viewBox="0 0 100 100" width="100%" height="100%"><defs>${defs}</defs>${body}</svg>`;
}

/* ===== ゲーム本体 ===== */
let G=null;
const hw=$('#hw');let hg=null,HW=0,HH_=0;
function sizeCanvas(){const dpr=window.devicePixelRatio||1;HW=hw.clientWidth;HH_=hw.clientHeight;hw.width=HW*dpr;hw.height=HH_*dpr;hg=hw.getContext('2d');hg.setTransform(dpr,0,0,dpr,0,0)}
function buildPads(used){
  const el=$('#pads');el.innerHTML='';
  for(const ln of LANES){
    const I=INFO[ln],p=document.createElement('div');
    p.className='pad'+(used.has(ln)?'':' off');p.id='pad'+ln;
    p.innerHTML=padSVG(ln)+`<span class="pl" style="color:${I.c}">${I.n}</span>`;
    p.style.cssText=`left:${I.x}%;top:${I.y}%;width:${I.d}%;aspect-ratio:1`;
    p.addEventListener('pointerdown',e=>{
      e.preventDefault();if(!ctx)return;
      let lag=(performance.now()-e.timeStamp)/1000;if(!(lag>=0&&lag<0.1))lag=0;
      hit(ln,ctx.currentTime-lag);
    });
    el.appendChild(p);
  }
}
function flashPad(ln){const p=$('#pad'+ln);if(!p)return;p.classList.add('hit');setTimeout(()=>p.classList.remove('hit'),70)}
async function startGame(auto){
  await initAudio();
  const S=DB.set;if(S.off==null){S.off=defaultOff();save()}
  const ch=buildChart(S.level,S.bars,S.tempo);
  $('#menu').style.display='none';$('#game').style.display='flex';
  $('#gname').textContent=`Lv${S.level+1} ${LEVELS[S.level].name} ♩=${ch.bpm}${auto?'（お手本）':''}`;
  buildPads(ch.used);sizeCanvas();
  const W=WIN[S.judge].map(v=>v/1000);
  G={...ch,auto,W,off:S.off/1000,t0:ctx.currentTime+0.3+4*ch.spb,srcs:[],extra:0,combo:0,maxCombo:0,cnt:{p:0,g:0,o:0,m:0},
     flash:{},msg:null,run:true,mi:0,ai:0,lastT:ch.notes[ch.notes.length-1].t};
  if(S.click||auto===false)for(let k=-4;k<ch.beats;k++){if(k>=0&&!S.click)continue;G.srcs.push(play(k<0||k%4===0?'CK1':'CK2',G.t0+k*ch.spb,k<0?1:0.7))}
  G.backing=auto||S.snd==='auto';

function stopGame(){
  if(!G)return;G.run=false;
  for(const s of G.srcs)try{s.stop()}catch(e){}
  $('#game').style.display='none';$('#menu').style.display='';
}
function hit(lane,at){
  flashPad(lane);
  if(!G||!G.run||G.auto){play(lane);return}
  if(!G.backing)play(lane);
  const ts=at-G.t0-G.off;let best=null,bd=1e9;
  for(let i=G.mi;i<G.notes.length;i++){
    const n=G.notes[i];if(n.t-ts>G.W[2])break;
    if(n.j||n.lane!==lane)continue;
    const d=Math.abs(n.t-ts);if(d<bd){bd=d;best=n}
  }
  if(!best||bd>G.W[2]){if(ts>-0.2)G.extra++;return}
  const dt=ts-best.t;best.dt=dt*1000;
  best.j=bd<=G.W[0]?'p':bd<=G.W[1]?'g':'o';G.cnt[best.j]++;
  G.combo++;if(G.combo>G.maxCombo)G.maxCombo=G.combo;
  G.flash[lane]=performance.now();
  G.msg={t:performance.now(),txt:{p:'PERFECT',g:'GREAT',o:'GOOD'}[best.j],sub:`${Math.abs(best.dt)<5?'ぴったり':best.dt<0?'早い':'遅い'} ${sgn(best.dt)}ms`,col:{p:'#66bb6a',g:'#4fc3f7',o:'#ffb74d'}[best.j]};
}
function frame(){
  if(!G||!G.run)return;
  const now=ctx.currentTime-G.t0-G.off,pn=performance.now();
  // 見逃し判定・お手本
  while(G.mi<G.notes.length&&(G.notes[G.mi].j||now-G.notes[G.mi].t>G.W[2])){
    const n=G.notes[G.mi];if(!n.j){n.j='m';G.cnt.m++;G.combo=0;G.msg={t:pn,txt:'MISS',sub:INFO[n.lane].n,col:'#ef5350'}}
    G.mi++;
  }
  if(G.auto)while(G.ai<G.notes.length&&G.notes[G.ai].t<=now){const n=G.notes[G.ai++];n.j='p';G.flash[n.lane]=pn;flashPad(n.lane)}
  draw(now,pn);
  $('#gstat').textContent=G.auto?'':`コンボ ${G.combo}`;
  if(now>G.lastT+1.2){G.run=false;G.auto?stopGame():finish();return}
  requestAnimationFrame(frame);
}
function draw(now,pn){
  const g=hg,w=HW,h=HH_,lw=w/LANES.length,lineY=h-34,look=1.7/DB.set.speed,y=t=>lineY-(t-now)/look*lineY;
  g.clearRect(0,0,w,h);
  LANES.forEach((ln,i)=>{
    const on=G.used.has(ln);
    g.fillStyle=i%2?'#0e1216':'#0b0e11';g.fillRect(i*lw,0,lw,h);
    const f=G.flash[ln];if(f&&pn-f<140){g.fillStyle=INFO[ln].c;g.globalAlpha=0.35*(1-(pn-f)/140);g.fillRect(i*lw,0,lw,h);g.globalAlpha=1}
    g.fillStyle=on?INFO[ln].c:'#3a424c';g.font='bold 10px sans-serif';g.textAlign='center';g.fillText(ln,i*lw+lw/2,h-8);
  });
  // 拍の線
  const b0=Math.ceil(now/G.spb);
  for(let b=b0;b*G.spb<now+look;b++){if(b<0||b>G.beats)continue;g.strokeStyle=b%4===0?'#55606c':'#262d35';g.lineWidth=b%4===0?1.5:1;g.beginPath();g.moveTo(0,y(b*G.spb));g.lineTo(w,y(b*G.spb));g.stroke()}
  g.strokeStyle='#fff';g.lineWidth=3;g.beginPath();g.moveTo(0,lineY);g.lineTo(w,lineY);g.stroke();
  for(let i=G.mi;i<G.notes.length;i++){
    const n=G.notes[i];if(n.t>now+look)break;if(n.j&&n.j!=='m')continue;
    const li=LANES.indexOf(n.lane),yy=y(n.t);
    g.fillStyle=INFO[n.lane].c;const nh=n.lane==='BD'?8:12;
    g.beginPath();g.roundRect?g.roundRect(li*lw+3,yy-nh/2,lw-6,nh,4):g.rect(li*lw+3,yy-nh/2,lw-6,nh);g.fill();
  }
  g.textAlign='center';
  if(now<0){g.fillStyle='#fff';g.font='bold 64px sans-serif';g.fillText(String(Math.max(1,Math.ceil(-now/G.spb))),w/2,h*0.45)}
  else if(G.msg&&pn-G.msg.t<450){
    g.globalAlpha=1-(pn-G.msg.t)/450*0.6;g.fillStyle=G.msg.col;g.font='bold 30px sans-serif';g.fillText(G.msg.txt,w/2,h*0.4);
    g.font='bold 18px sans-serif';g.fillStyle='#fff';g.fillText(G.msg.sub,w/2,h*0.4+26);g.globalAlpha=1;
  }
  g.textAlign='left';
}

/* ===== 結果 ===== */
function prep(c){const dpr=window.devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*dpr;c.height=h*dpr;const g=c.getContext('2d');g.scale(dpr,dpr);g.font='11px sans-serif';return {g,w,h}}
function drawHisto(c,offs,W){
  const {g,w,h}=prep(c),R=Math.max(100,W[2]),bw=10,nb=2*R/bw,bins=new Array(nb).fill(0);
  for(const o of offs){const k=clamp(Math.floor((o+R)/bw),0,nb-1);bins[k]++}
  const mx=Math.max(1,...bins),x=v=>(v+R)/(2*R)*w;
  g.fillStyle='rgba(102,187,106,.15)';g.fillRect(x(-W[0]),0,x(W[0])-x(-W[0]),h-16);
  bins.forEach((b,i)=>{const v=-R+i*bw+bw/2;g.fillStyle=Math.abs(v)<=W[0]?'#66bb6a':Math.abs(v)<=W[1]?'#4fc3f7':'#ffb74d';const hh=b/mx*(h-30);g.fillRect(i/nb*w+1,h-16-hh,w/nb-2,hh)});
  g.strokeStyle='#fff';g.beginPath();g.moveTo(x(0),0);g.lineTo(x(0),h-16);g.stroke();
  g.fillStyle='#7b8590';g.textAlign='center';for(const v of [-R,-R/2,0,R/2,R])g.fillText(sgn(v)+'ms',clamp(x(v),22,w-22),h-3);
  g.textAlign='left';g.fillText('← 早い',4,12);g.textAlign='right';g.fillText('遅い →',w-4,12);
}
function drawTimeline(c,notes,dur,W){
  const {g,w,h}=prep(c),R=W[2],x=t=>8+t/dur*(w-16),y=o=>h/2-clamp(o,-R,R)/R*(h/2-12);
  g.fillStyle='rgba(102,187,106,.15)';g.fillRect(0,y(W[0]),w,y(-W[0])-y(W[0]));
  g.strokeStyle='#66bb6a';g.beginPath();g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
  g.fillStyle='#7b8590';g.fillText('遅い ↑',4,12);g.fillText('早い ↓',4,h-4);
  for(const n of notes){
    if(n.j==='m'){g.fillStyle='#ef5350';g.fillText('×',x(n.t)-3,h/2+4);continue}
    g.fillStyle=INFO[n.lane].c;g.beginPath();g.arc(x(n.t),y(n.dt),3,0,7);g.fill();
  }
}
function finish(){

  const total=N.length,score=Math.round(100*(c.p+0.8*c.g+0.5*c.o)/total);
  const m=mean(offs),sd=std(offs),rank=score>=95?'S':score>=85?'A':score>=70?'B':score>=50?'C':'D';
  const grp=(key,vals,name)=>vals.map(v=>{const a=hits.filter(n=>n[key]===v).map(n=>n.dt),tot=N.filter(n=>n[key]===v).length;return tot?{v,name:name(v),n:a.length,tot,m:mean(a),sd:std(a)}:null}).filter(Boolean);
  const byLane=grp('lane',LANES,v=>INFO[v].n),byPos=grp('pos',['on','off','six','tri'],v=>({on:'表拍',off:'裏拍（8分）',six:'16分',tri:'3連の2・3つ目'}[v]));
  let slope=0;if(hits.length>=8){const ts=hits.map(n=>n.t),mt=mean(ts);let a=0,b=0;hits.forEach(n=>{a+=(n.t-mt)*(n.dt-m);b+=(n.t-mt)**2});slope=b?a/b*10:0}

    else if(m<-15)adv.push('全体に早め（突っ込み気味）です。クリックを「聞いてから」ではなく、クリックと自分の音が重なって1つに聞こえる位置を狙います。');
    else if(m>15)adv.push('全体に遅め（もたり気味）です。画面のノーツを見てから叩くと遅れます。足や体で拍を取り、次の拍を予測して叩きます。');

    else if(sd<=15)adv.push('ばらつきがとても小さく、安定しています。');
    const on=byPos.find(p=>p.v==='on'),ot=byPos.filter(p=>p.v!=='on'&&p.n>=4);

    const wl=byLane.filter(l=>l.n>=4).sort((a,b)=>(Math.abs(b.m)+b.sd)-(Math.abs(a.m)+a.sd))[0];
    if(wl&&Math.abs(wl.m)+wl.sd>40&&byLane.length>1)adv.push(`${wl.name}のタイミングがいちばん不安定です（平均 ${sgn(wl.m)}ms、ばらつき ${Math.round(wl.sd)}ms）。`);
    if(Math.abs(slope)>8)adv.push(`曲が進むにつれて${slope<0?'早く':'遅く'}なっています（10秒あたり ${sgn(slope)}ms）。${slope<0?'走る傾向':'集中が切れて遅れる傾向'}があります。`);

  const up=score>=85&&S.level<LEVELS.length-1;
  const prev=DB.best[S.level];

  const row=r=>`<tr><td>${r.name}</td><td>${r.n}/${r.tot}</td><td class="${Math.abs(r.m)<=15?'ok':'warn'}">${r.n?sgn(r.m)+'ms':'-'}</td><td class="${r.sd<=20?'ok':r.sd<=35?'warn':'bad'}">${r.n>1?Math.round(r.sd)+'ms':'-'}</td></tr>`;
  $('#menu').innerHTML=`<h1>結果</h1><p class="sub">Lv${S.level+1} ${L.name}・♩=${G.bpm}・判定 ${({easy:'やさしい',normal:'ふつう',hard:'きびしい'})[S.judge]}</p>
  <div class="card"><div class="big">${score}点 <span style="color:var(--acc)">${rank}</span></div>
    <table><tr><td class="ok">PERFECT（±${W[0]}ms）</td><td>${c.p}</td></tr><tr><td style="color:var(--acc)">GREAT（±${W[1]}ms）</td><td>${c.g}</td></tr>
    <tr><td class="warn">GOOD（±${W[2]}ms）</td><td>${c.o}</td></tr><tr><td class="bad">MISS</td><td>${c.m}</td></tr>

  <div class="card"><b>タイミングのずれ</b>
    <table><tr><td>平均（早い−／遅い＋）</td><td><b class="${Math.abs(m)<=15?'ok':'warn'}">${hits.length?sgn(m)+'ms':'-'}</b></td></tr>
    <tr><td>ばらつき（標準偏差）</td><td><b class="${sd<=20?'ok':sd<=35?'warn':'bad'}">${hits.length>1?Math.round(sd)+'ms':'-'}</b></td></tr>
    <tr><td>早い：遅い</td><td>${offs.filter(o=>o<-5).length}：${offs.filter(o=>o>5).length} <span class="sub">（±5ms以内 ${offs.filter(o=>Math.abs(o)<=5).length}）</span></td></tr></table>

  <div class="card"><b>楽器別</b><table><tr class="sub"><td></td><td>命中</td><td>平均</td><td>ばらつき</td></tr>${byLane.map(row).join('')}</table>

/* ===== 遅延の測定 ===== */
async function calib(){
  await initAudio();
  const BPM=90,iv=60/BPM,COUNT=4,BEATS=12;let taps=null,alive=true;
  $('#menu').innerHTML=`<h1>遅延を測る</h1><p class="sub">いま使っているイヤホン（またはスピーカー）で聞いてください。「カッ」という音に合わせて下の枠をタップします。最初の4拍（高い音）は準備で、その後の${BEATS}拍を計測します。</p>
    <div class="tap" id="tap">ここをタップ</div><div class="sub" id="cst" style="text-align:center"></div>
    <button class="primary" id="cgo">スタート</button><div id="cres"></div><button id="cback">戻る</button>`;
  const tap=$('#tap');
  tap.addEventListener('pointerdown',e=>{e.preventDefault();if(!taps)return;let lag=(performance.now()-e.timeStamp)/1000;if(!(lag>=0&&lag<0.1))lag=0;
    taps.push(ctx.currentTime-lag);tap.classList.add('flash');setTimeout(()=>tap.classList.remove('flash'),80)});
  $('#cback').onclick=()=>{alive=false;menu()};
  $('#cgo').onclick=async()=>{
    $('#cgo').disabled=true;$('#cres').innerHTML='';
    const t0=ctx.currentTime+0.6,beats=[];
    for(let i=0;i<COUNT+BEATS;i++){const t=t0+i*iv;play(i<COUNT?'CK1':'CK2',t);if(i>=COUNT)beats.push(t)}
    taps=[];
    while(alive&&ctx.currentTime<t0+(COUNT+BEATS)*iv+0.5){const k=Math.floor((ctx.currentTime-t0)/iv);$('#cst').textContent=k<0?'準備…':k<COUNT?`準備 ${k+1}/${COUNT}`:`計測中 ${Math.min(k-COUNT+1,BEATS)}/${BEATS}`;await new Promise(r=>setTimeout(r,50))}
    if(!alive)return;
    const offs=[];for(const t of taps){let b=beats[0];for(const x of beats)if(Math.abs(t-x)<Math.abs(t-b))b=x;if(Math.abs(t-b)<iv/2)offs.push((t-b)*1000)}
    taps=null;$('#cgo').disabled=false;$('#cgo').textContent='もう一度';$('#cst').textContent='';
    if(offs.length<8){$('#cres').innerHTML='<p class="warn">タップが少なすぎました（8回以上必要）。もう一度どうぞ。</p>';return}
    const m=Math.round(median(offs)),sd=Math.round(std(offs));
    DB.set.off=clamp(m,-100,500);save();
    $('#cres').innerHTML=`<div class="card"><p>判定補正を <b>${DB.set.off}ms</b> に設定しました（タップのばらつき ${sd}ms）。</p>
      <p class="sub">${m>=100?'音の遅れが大きいので、「自動演奏に合わせて叩く」モードがおすすめです。':'遅れは小さいので、「叩いた音を鳴らす」モードで違和感なく使えるはずです。'}${sd>40?' ばらつきが大きいので、もう一度測ると確実です。':''}</p></div>`;
    if(m>=100){DB.set.snd='auto';save()}
  };
}
menu();
</script>
</body>
</html>
